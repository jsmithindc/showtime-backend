<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Showtime Finder</title>
<style>
  :root {
    --ink: #f4efe6;
    --ink-dim: #b8ada0;
    --marquee: #14121a;
    --marquee-2: #1d1a24;
    --marquee-3: #252030;
    --gold: #e2a545;
    --gold-dim: #8a6a34;
    --stub-line: #3a3444;
    --stubs-bg: rgba(80,180,100,0.08);
    --stubs-label: #6aab78;
    --stubs-amt: #7dd68a;
    --best: #7fa66b;
    --warn: #c98a3d;
    --error: #c96a5a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--marquee);
    color: var(--ink);
    margin: 0;
    padding: 28px 18px 64px;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 30px;
    color: var(--gold);
    margin: 0 0 2px;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 13px;
    margin: 0 0 22px;
  }

  .panel {
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 22px;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 14px;
  }

  .field { flex: 1 1 160px; min-width: 130px; }
  .field.wide { flex-basis: 260px; }
  /* min-width: 0 overrides the flex default (min-width: auto), which
     otherwise lets a child's intrinsic content size win over its own
     width: 100% -- iOS Safari's native time-input wheel has exactly that
     kind of intrinsic minimum, and without this it pushes the field
     wider than the row/card around it instead of shrinking to fit. */
  .field.field-time { min-width: 0; }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="number"],
  input[type="time"] {
    width: 100%;
    max-width: 100%;
    background: var(--marquee);
    border: 1px solid var(--stub-line);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }

  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* iOS Safari/WebKit (which Brave, Chrome, etc. all run on under Apple's
     rules) doesn't fully honor box-sizing: border-box on the native
     time-input control -- its own picker chrome pads out past the
     declared box instead of being contained inside it, so the rendered
     control ends up wider than the card around it. Stripping the native
     appearance hands sizing back to normal CSS box-model rules; the
     control still opens the native wheel picker on tap since it's still
     type="time", only its skin changes. */
  input[type="time"] {
    -webkit-appearance: none;
    appearance: none;
  }

  .coord-row { display: flex; gap: 8px; align-items: flex-end; }
  .coord-row .field { flex: 1; }

  .locate-btn {
    background: var(--marquee-3);
    border: 1px solid var(--stub-line);
    color: var(--gold);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .locate-btn:hover { border-color: var(--gold-dim); }
  .locate-btn:disabled { opacity: 0.5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }

  .filter-section { margin-bottom: 8px; }
  .filter-section summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    list-style: none;
    user-select: none;
    font-size: 14px;
    color: var(--ink-dim);
    padding: 4px 0;
  }
  .filter-section summary::-webkit-details-marker { display: none; }
  .filter-section summary .filter-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-section summary .filter-chevron {
    font-size: 10px;
    transition: transform 0.15s;
    color: var(--ink-dim);
  }
  .filter-section[open] summary .filter-chevron { transform: rotate(90deg); }
  .filter-section summary .filter-status {
    font-size: 11px;
    color: var(--ink-dim);
  }
  .filter-section .filter-body { padding: 6px 0 4px; }

  .chip {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--stub-line);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .chip.on {
    border-color: var(--gold);
    color: var(--marquee);
    background: var(--gold);
    font-weight: 600;
  }

  /* Deliberately NOT reusing .chip here. The format/chain filters are
     independent pill toggles (any subset can be on), so their rounded,
     individually-bordered look correctly signals "pick any of these."
     Sort mode is a mutually-exclusive EITHER/OR choice -- exactly one
     is always active -- so it gets a segmented-control look instead:
     one shared rectangular border, a divider between the two options,
     sharp corners instead of full pills, and a neutral dark fill
     instead of gold (gold is used elsewhere for price/selection
     emphasis; reusing it here would visually imply this is another
     filter chip row rather than a different kind of control). */
  .sort-toggle {
    display: inline-flex;
    border: 1px solid var(--stub-line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .sort-toggle button {
    font-size: 12.5px;
    padding: 6px 14px;
    border: none;
    border-right: 1px solid var(--stub-line);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .sort-toggle button:last-child { border-right: none; }
  .sort-toggle button.on {
    background: var(--ink-dim);
    color: #fff;
    font-weight: 600;
  }

  .search-btn {
    width: 100%;
    background: var(--gold);
    color: var(--marquee);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .search-btn:hover { background: #eeb75c; }
  .search-btn:disabled { opacity: 0.6; cursor: default; }

  .status-line {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 14px;
    min-height: 18px;
  }
  .status-line b { color: var(--gold); }

  .banner {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .banner.warn { background: rgba(201, 138, 61, 0.12); border: 1px solid var(--warn); color: var(--warn); }
  .banner.error { background: rgba(201, 106, 90, 0.12); border: 1px solid var(--error); color: var(--error); }
  .overflow-banner {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 10px;
    padding: 8px 12px;
    border: 1px solid var(--stub-line);
    border-radius: 8px;
  }
  .overflow-reveal-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  .empty {
    border: 1px dashed var(--stub-line);
    border-radius: 10px;
    padding: 30px 18px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
  }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    display: flex;
    align-items: stretch;
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card.best { border-color: var(--best); }

  .price-col {
    width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px dashed var(--stub-line);
    padding: 12px 8px;
    text-align: center;
  }
  .price {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--gold);
  }
  .price.unknown {
    font-size: 12px;
    color: var(--ink-dim);
    font-weight: 400;
  }
  .price-breakdown {
    font-size: 10.5px;
    color: var(--ink-dim);
    font-weight: 400;
    margin-top: 2px;
    line-height: 1.3;
  }
  .stubs-stub {
    margin-top: 8px;
    padding: 6px 8px;
    background: var(--stubs-bg);
    border-radius: 5px;
    min-width: 0;
  }
  .stubs-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--stubs-label);
    margin-bottom: 4px;
  }
  .stubs-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    line-height: 1.5;
  }
  .stubs-venue {
    font-size: 11px;
    color: var(--ink-dim);
  }
  .stubs-amt {
    font-size: 12px;
    font-weight: 600;
    color: var(--stubs-amt);
    white-space: nowrap;
  }
  .stubs-amt-solo {
    font-size: 15px;
  }
  .stubs-note {
    font-size: 10px;
    color: var(--ink-dim);
    margin-top: 3px;
    line-height: 1.3;
  }
  .best-tag {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--best);
    font-weight: 700;
    margin-top: 4px;
  }

  .card-body { flex: 1; padding: 12px 16px; min-width: 0; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .theater-name { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dist { font-size: 12px; color: var(--ink-dim); white-space: nowrap; flex-shrink: 0; }

  .meta {
    margin-top: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .format-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 2px 7px;
  }
  .time { color: var(--ink); font-weight: 500; }
  /* Matches .price's visual weight (same font/size/weight) so the
     showtime reads as equally important as the price at a glance --
     ink-colored rather than gold to keep price as the one gold "hero"
     number on the card, per the ticket-stub design language. */
  .time-large {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-top: 6px;
  }
  .time-sub {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .card-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gold-dim);
    text-decoration: none;
  }
  .card-link:hover { color: var(--gold); text-decoration: underline; }

  .price-source {
    font-size: 10.5px;
    color: var(--ink-dim);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.15s ease; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Showtime Finder <span id="versionBadge" style="font-size:12px; font-weight:400; color:#888; vertical-align:middle;">5.7.9</span></h1>
  <p class="subtitle">Cheapest ticket, any format, that still gets you out on time.</p>

  <div class="panel">
    <div class="row" style="margin-bottom:12px;">
      <button class="chip on" id="modeMovieBtn" type="button">Search a specific movie</button>
      <button class="chip" id="modeWindowBtn" type="button">What fits my free time?</button>
    </div>

    <div id="specificMovieFields">
      <div class="row">
        <div class="field wide" style="flex-basis:100%;">
          <label for="movie">Movie</label>
          <div style="display:flex; gap:8px;">
            <select id="movie" style="flex:1; min-width:0;">
              <option value="" disabled selected>Loading what's in theaters...</option>
            </select>
            <button class="locate-btn" id="loadMoviesBtn" type="button" style="flex-shrink:0; opacity:0.6; font-size:12px; padding:6px 10px;" title="Look up movies playing specifically at theaters near you -- for anything not in the list already, like a local/independent theater">Not seeing it?</button>
          </div>
          <input type="text" id="movieFreeText" placeholder="Not in the list? Type a title here..." style="display:none; margin-top:6px; width:100%; box-sizing:border-box;" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <div class="field field-time">
          <label for="deadline">Must end by</label>
          <input type="time" id="deadline" value="22:00" />
        </div>
      </div>
    </div>

    <div class="row" id="windowFields" style="display:none;">
      <div class="field field-time">
        <label for="availableFrom">Free from</label>
        <input type="time" id="availableFrom" />
      </div>
      <div class="field">
        <label for="availableForHours">For how long (hours)</label>
        <input type="number" id="availableForHours" value="3" min="0.5" step="0.5" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="searchDate">Date</label>
        <input type="date" id="searchDate" />
      </div>
      <div class="field">
        <label for="radius">Within (minutes)</label>
        <input type="number" id="radius" value="15" min="1" />
      </div>
    </div>

    <div class="row">
      <div class="field wide">
        <label for="place">Location</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="place" placeholder="Zip code or city, e.g. 92835 or Fullerton, CA" style="flex:1;" />
          <button class="locate-btn" id="locateBtn" type="button">Use my location</button>
        </div>
      </div>
    </div>
    <!-- Set directly by "Use my location" (bypasses geocoding); left
         empty otherwise, in which case the place text above is geocoded
         server-side. -->
    <input type="hidden" id="lat" />
    <input type="hidden" id="lng" />

    <details class="filter-section" id="formatSection">
      <summary>
        <span class="filter-label">
          <span class="filter-chevron">▶</span>
          Formats
        </span>
        <span class="filter-status" id="formatSectionStatus">All</span>
      </summary>
      <div class="filter-body">
        <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
          <span id="formatChipsToggle" style="font-size:11px; color:var(--ink-dim); cursor:pointer; user-select:none;">none</span>
        </div>
        <div class="chips" id="formatChips">
          <button class="chip on" data-format="standard">Standard</button>
          <button class="chip on" data-format="3d">3D</button>
          <button class="chip on" data-format="imax">IMAX</button>
          <button class="chip on" data-format="dolby cinema">Dolby Cinema</button>
          <button class="chip on" data-format="px rpx">RPX</button>
          <button class="chip on" data-format="4dx">4DX</button>
          <button class="chip on" data-format="screenx">ScreenX</button>
          <button class="chip on" data-format="lg led">LG LED</button>
        </div>
      </div>
    </details>

    <details class="filter-section" id="chainSection">
      <summary>
        <span class="filter-label">
          <span class="filter-chevron">▶</span>
          Chains
        </span>
        <span class="filter-status" id="chainSectionStatus">All</span>
      </summary>
      <div class="filter-body">
        <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
          <span id="chainChipsToggle" style="font-size:11px; color:var(--ink-dim); cursor:pointer; user-select:none;">none</span>
        </div>
        <div class="chips" id="chainChips">
          <button class="chip on" data-chain="amc">AMC</button>
          <button class="chip on" data-chain="regal">Regal</button>
          <button class="chip on" data-chain="cinemark">Cinemark</button>
          <button class="chip on" data-chain="cinemawest">Cinema West</button>
          <button class="chip on" data-chain="harkins">Harkins</button>
          <button class="chip on" data-chain="regency">Regency</button>
          <button class="chip on" data-chain="alamo">Alamo</button>
          <button class="chip on" data-chain="marcus">Marcus</button>
          <button class="chip on" data-chain="landmark">Landmark</button>
        </div>
      </div>
    </details>

    <button class="search-btn" id="searchBtn" type="button">Find showtimes</button>
  </div>

  <div class="status-line" id="statusLine"></div>
  <div id="timingBar" style="display:none; font-size:12px; color:var(--ink-dim); margin-bottom:10px; font-family:monospace;"></div>
  <div id="banners"></div>
  <div id="results"></div>
</div>

<script>
  const els = {
    modeMovieBtn: document.getElementById('modeMovieBtn'),
    modeWindowBtn: document.getElementById('modeWindowBtn'),
    specificMovieFields: document.getElementById('specificMovieFields'),
    windowFields: document.getElementById('windowFields'),
    availableFrom: document.getElementById('availableFrom'),
    availableForHours: document.getElementById('availableForHours'),
    movie: document.getElementById('movie'),
    searchDate: document.getElementById('searchDate'),
    radius: document.getElementById('radius'),
    deadline: document.getElementById('deadline'),
    lat: document.getElementById('lat'),
    lng: document.getElementById('lng'),
    place: document.getElementById('place'),
    locateBtn: document.getElementById('locateBtn'),
    loadMoviesBtn: document.getElementById('loadMoviesBtn'),
    movieFreeText: document.getElementById('movieFreeText'),
    searchBtn: document.getElementById('searchBtn'),
    statusLine: document.getElementById('statusLine'),
    banners: document.getElementById('banners'),
    results: document.getElementById('results'),
  };

  let searchMode = 'movie'; // 'movie' | 'window'
  function setMode(mode) {
    searchMode = mode;
    const isWindow = mode === 'window';
    els.modeMovieBtn.classList.toggle('on', !isWindow);
    els.modeWindowBtn.classList.toggle('on', isWindow);
    els.specificMovieFields.style.display = isWindow ? 'none' : '';
    els.windowFields.style.display = isWindow ? '' : 'none';
    els.searchBtn.textContent = isWindow ? 'Find what fits' : 'Find showtimes';
    els.banners.innerHTML = '';
    els.results.innerHTML = '';
    els.statusLine.textContent = '';
  }
  els.modeMovieBtn.addEventListener('click', () => setMode('movie'));
  els.modeWindowBtn.addEventListener('click', () => setMode('window'));

  // Restore last-used values so repeat searches don't require retyping
  // everything -- this is a personal local tool, not a shared page.
  const STORAGE_KEY = 'showtimeFinder.lastSearch';
  // The movie field is a real <select>, so a saved title can't be applied
  // directly until "Load nearby" actually populates matching <option>s.
  // Remember it here and re-apply it once that happens.
  let pendingMovieSelection = null;
  function loadSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (saved.movie) pendingMovieSelection = saved.movie;
      if (saved.radius) els.radius.value = saved.radius;
      if (saved.deadline) els.deadline.value = saved.deadline;
      // Guard against restoring a stale "Current location (...)" label
      // from an old session -- it's meaningless without the paired
      // lat/lng, which is deliberately never persisted.
      if (saved.place && !saved.place.startsWith('Current location')) {
        els.place.value = saved.place;
      }
    } catch {}
    // Date is deliberately NOT restored from localStorage -- always
    // default to today on load, rather than silently reusing whatever
    // date was last searched.
    //
    // CRITICAL: new Date().toISOString() is always UTC, not local time.
    // Confirmed as a real live bug: after ~5pm Pacific, UTC has already
    // rolled to the next calendar day, so this silently pre-filled the
    // date picker with TOMORROW's date before the user touched anything
    // -- then the server's (also-buggy, now fixed) deadline check saw a
    // future-dated search and filtered out every real showing as
    // "already started." Use local date components instead.
    const todayLocal = new Date();
    const todayISOLocal =
      `${todayLocal.getFullYear()}-${String(todayLocal.getMonth() + 1).padStart(2, '0')}-${String(todayLocal.getDate()).padStart(2, '0')}`;
    els.searchDate.value = todayISOLocal;
    // Same reasoning for "free from" -- always default to right now.
    const now = new Date();
    const roundedMinutes = Math.ceil(now.getMinutes() / 5) * 5;
    now.setMinutes(roundedMinutes, 0, 0);
    els.availableFrom.value = now.toTimeString().slice(0, 5);
  }
  function saveCurrent() {
    // Don't persist the geolocation placeholder text -- it's only
    // meaningful paired with the (never-persisted) lat/lng that produced
    // it, so saving it alone would just save a location that will fail
    // to geocode next time.
    const placeToSave = els.place.value.startsWith('Current location') ? '' : els.place.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      movie: els.movie.value,
      radius: els.radius.value,
      deadline: els.deadline.value,
      place: placeToSave,
    }));
  }
  loadSaved();


  // Pre-load a location-independent list of what's currently in wide
  // release, so picking a common movie doesn't require waiting on
  // "Not seeing it?" (which needs a location filled in first, and
  // costs a real SerpApi call per nearby theater) just to populate the
  // dropdown. Runs automatically on page load, no button press needed.
  (async () => {
    try {
      const res = await fetch('/api/popular-movies');
      const data = await res.json();
      if (res.ok && data.movies && data.movies.length) {
        els.movie.innerHTML = data.movies.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        if (pendingMovieSelection && data.movies.includes(pendingMovieSelection)) {
          els.movie.value = pendingMovieSelection;
          pendingMovieSelection = null;
        }
      } else {
        els.movie.innerHTML = '<option value="" disabled selected>Fill in a location and press "Not seeing it?" to find movies</option>';
      }
    } catch {
      els.movie.innerHTML = '<option value="" disabled selected>Fill in a location and press "Not seeing it?" to find movies</option>';
    }
  })();

  // If the person edits the location text after using "Use my location",
  // the old coordinates are almost certainly stale -- clear them so the
  // next search geocodes the new text instead of silently using an old
  // GPS fix that no longer matches what's displayed.
  els.place.addEventListener('input', () => {
    els.lat.value = '';
    els.lng.value = '';
  });

  els.locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      els.statusLine.textContent = "Geolocation isn't available in this browser -- enter a zip code or city instead.";
      return;
    }
    els.locateBtn.disabled = true;
    els.locateBtn.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        els.lat.value = pos.coords.latitude.toFixed(4);
        els.lng.value = pos.coords.longitude.toFixed(4);
        // Setting .value programmatically doesn't fire the 'input' event
        // listener that clears lat/lng, so this is safe.
        els.place.value = `Current location (${els.lat.value}, ${els.lng.value})`;
        els.locateBtn.disabled = false;
        els.locateBtn.textContent = 'Use my location';
      },
      (err) => {
        els.statusLine.textContent = `Couldn't get your location: ${err.message}. Enter a zip code or city instead.`;
        els.locateBtn.disabled = false;
        els.locateBtn.textContent = 'Use my location';
      }
    );
  });

  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => chip.classList.toggle('on'));
  });

  function setupChipGroupToggle(toggleEl, chipsEl, sectionEl, statusEl) {
    function updateLabel() {
      const chips = [...chipsEl.querySelectorAll('.chip')];
      const onCount = chips.filter((c) => c.classList.contains('on')).length;
      const allOn = onCount === chips.length;
      toggleEl.textContent = allOn ? 'none' : 'all';
      if (statusEl) statusEl.textContent = allOn ? 'All' : `${onCount} of ${chips.length}`;
      // Auto-open the section when something is deselected so the state is visible
      if (sectionEl && !allOn) sectionEl.open = true;
    }
    chipsEl.addEventListener('click', updateLabel);
    toggleEl.addEventListener('click', () => {
      const allOn = [...chipsEl.querySelectorAll('.chip')].every((c) => c.classList.contains('on'));
      chipsEl.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', !allOn));
      updateLabel();
    });
  }
  setupChipGroupToggle(
    document.getElementById('formatChipsToggle'),
    document.getElementById('formatChips'),
    document.getElementById('formatSection'),
    document.getElementById('formatSectionStatus')
  );
  setupChipGroupToggle(
    document.getElementById('chainChipsToggle'),
    document.getElementById('chainChips'),
    document.getElementById('chainSection'),
    document.getElementById('chainSectionStatus')
  );

  async function loadMovies({ silent = false } = {}) {
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();

    if ((!lat || !lng) && !place) {
      if (!silent) els.statusLine.textContent = 'Fill in a zip code or city first -- movie lookup needs to know where to look.';
      return;
    }
    if (!radius) {
      if (!silent) els.statusLine.textContent = 'Fill in a radius first.';
      return;
    }

    els.loadMoviesBtn.disabled = true;
    els.loadMoviesBtn.textContent = 'Loading...';
    els.statusLine.textContent = "Checking what's actually playing nearby...";

    try {
      const params = new URLSearchParams({ radiusMin: radius, date: els.searchDate.value });
      if (lat && lng) {
        params.set('lat', lat);
        params.set('lng', lng);
      } else {
        params.set('place', place);
      }
      const res = await fetch(`/api/movies?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        els.statusLine.textContent = `Movie lookup failed: ${data.error || 'unknown error'}`;
        return;
      }

      if (data.movies.length) {
        // Merge with whatever's already loaded (the pre-loaded popular
        // list, most likely) rather than replacing it -- this button is
        // now specifically for "add what's missing," so wiping out
        // options that were already there would be a regression.
        const currentSelection = els.movie.value;
        const existingTitles = new Set(
          [...els.movie.options].map((o) => o.value).filter(Boolean)
        );
        const newTitles = data.movies.filter((m) => !existingTitles.has(m));
        if (newTitles.length) {
          els.movie.insertAdjacentHTML(
            'beforeend',
            newTitles.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')
          );
          // Keep the whole list alphabetical after appending -- without
          // this, newly-discovered titles would land at the end in
          // whatever order the server returned them, breaking the sort
          // order the initial "/api/popular-movies" load already
          // established.
          const sortedOptions = [...els.movie.options].sort((a, b) =>
            a.value.localeCompare(b.value, undefined, { sensitivity: 'base' })
          );
          sortedOptions.forEach((opt) => els.movie.appendChild(opt)); // re-appending an existing <option> moves it, doesn't duplicate it
        }
        // Re-apply a saved selection from a previous session if it's
        // now among the loaded movies; otherwise keep whatever was
        // already selected.
        if (pendingMovieSelection && [...els.movie.options].some((o) => o.value === pendingMovieSelection)) {
          els.movie.value = pendingMovieSelection;
        } else if (currentSelection) {
          els.movie.value = currentSelection;
        }
        pendingMovieSelection = null;
      } else if (![...els.movie.options].some((o) => o.value)) {
        // Only show "nothing found" if the dropdown is otherwise
        // genuinely empty -- if the pre-loaded popular list already has
        // options, this button coming back empty just means "nothing
        // *extra* found," not "nothing at all."
        els.movie.innerHTML = '<option value="" disabled selected>No movies found nearby</option>';
      }
      els.statusLine.textContent = data.movies.length
        ? `Found ${data.movies.length} movie(s) playing across ${data.theatersChecked} nearby theater(s) -- pick one from the Movie dropdown.`
        : data.theatersChecked > 0
          ? `Found ${data.theatersChecked} theater(s) nearby but couldn't retrieve their schedules (SerpApi quota may be exhausted).`
          : `No theaters found in range -- try widening the radius.`;
    } catch (err) {
      els.statusLine.textContent = `Couldn't reach the server for movie lookup: ${err.message}`;
    } finally {
      els.loadMoviesBtn.disabled = false;
      els.loadMoviesBtn.textContent = 'Not seeing it?';
      if (!silent) els.movieFreeText.style.display = '';
    }
  }

  els.loadMoviesBtn.addEventListener('click', () => loadMovies());

  // "Use my location" button: after GPS coords land, reload the movie list.
  els.locateBtn.addEventListener('click', () => {
    const poll = setInterval(() => {
      if (els.lat.value && els.lng.value) {
        clearInterval(poll);
        loadMovies({ silent: true });
      }
    }, 200);
    setTimeout(() => clearInterval(poll), 10000);
  });

  // Auto-load on blur/Enter after typing a zip or city.
  function onPlaceCommit() {
    if (els.lat.value && els.lng.value) return; // already have coords from GPS
    loadMovies({ silent: true });
  }
  els.place.addEventListener('blur', onPlaceCommit);
  els.place.addEventListener('keydown', (e) => { if (e.key === 'Enter') onPlaceCommit(); });

  function fmtTime24to12(hhmmss) {
    if (!hhmmss) return '';
    const [h, m] = hhmmss.split(':').map(Number);
    const hour12 = ((h + 11) % 12) + 1;
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${hour12}:${String(m).padStart(2, '0')} ${ampm}`;
  }

  function fmtRuntime(minutes) {
    if (!minutes) return '';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  async function runSearch() {
    const movie = (els.movieFreeText.style.display !== 'none' && els.movieFreeText.value.trim())
      ? els.movieFreeText.value.trim()
      : els.movie.value.trim();
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();
    const deadline = els.deadline.value.trim();

    if (regalEs) { regalEs.close(); regalEs = null; }
    regalStillChecking = false;
    const _timingBar = document.getElementById('timingBar');
    if (_timingBar) _timingBar.style.display = 'none';
    els.banners.innerHTML = '';
    els.results.innerHTML = '';
    activeResultFormats = new Set(); seenResultFormats = new Set(); // fresh search -- reset to "all formats on"
    activeResultChains = new Set(); seenResultChains = new Set(); // fresh search -- reset to "all chains on"

    if (!movie || ((!lat || !lng) && !place) || !radius || !deadline) {
      els.banners.innerHTML = '<div class="banner error">Fill in movie, location, radius, and deadline before searching.</div>';
      return;
    }

    saveCurrent();

    const activeFormats = [...document.querySelectorAll('#formatChips .chip.on')].map((c) => c.dataset.format);
    const activeChains = [...document.querySelectorAll('#chainChips .chip.on')].map((c) => c.dataset.chain);

    const clientTime = Date.now();
    const params = new URLSearchParams({
      movie, radiusMin: radius, deadline,
      date: els.searchDate.value,
      clientTime,
      formats: activeFormats.join(','),
      chains: activeChains.join(','),
    });
    if (lat && lng) {
      params.set('lat', lat);
      params.set('lng', lng);
    } else {
      params.set('place', place);
    }

    // Request notification permission while still in the synchronous click
    // handler -- browsers require a direct user gesture for this prompt and
    // may silently ignore it if called after an await.
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }

    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching...';
    els.statusLine.textContent = 'Checking nearby theaters... Full results can take up to a minute.';

    // Timing bar
    const timingBar = document.getElementById('timingBar');
    const t0 = Date.now();
    let timingFirstResults = null, timingFirstRegal = null, timingDone = null;
    let timingTick = null;
    const renderTiming = (done) => {
      const elapsed = (ms) => (ms / 1000).toFixed(1) + 's';
      const now = Date.now();
      const parts = [`elapsed: ${elapsed(now - t0)}`];
      if (timingFirstResults !== null) parts.push(`first results: ${elapsed(timingFirstResults - t0)}`);
      if (timingFirstRegal !== null) parts.push(`first Regal: ${elapsed(timingFirstRegal - t0)}`);
      if (timingDone !== null) parts.push(`done: ${elapsed(timingDone - t0)}`);
      timingBar.style.display = '';
      timingBar.textContent = parts.join('  ·  ');
      if (done && timingTick) { clearInterval(timingTick); timingTick = null; }
    };
    timingTick = setInterval(() => renderTiming(false), 250);
    renderTiming(false);

    // When the user typed a place/zip instead of coordinates, geocode it
    // ONCE here before firing both /api/search and /api/search-regal.
    // Without this, both backend calls geocode the same place in parallel,
    // racing to Nominatim and triggering 429s on Render's shared IP range.
    // If the user typed a place/zip (no coordinates yet), pre-geocode it
    // once here so both /api/search and /api/search-regal get lat/lng +
    // locationLabel without each independently hitting Nominatim.
    // If the user used "Use my location" (GPS), they already have lat/lng
    // but no locationLabel -- pass place through so the backend geocodes
    // for the label; the inFlight dedup in geocode.js ensures only one
    // Nominatim/Photon call fires even if both endpoints hit it at once.
    let resolvedLat = lat, resolvedLng = lng, resolvedLocation = null;
    if ((!lat || !lng) && place) {
      try {
        const geo = await fetch(`/api/geocode?place=${encodeURIComponent(place)}`).then((r) => r.json());
        if (geo.error) throw new Error(geo.error);
        resolvedLat = String(geo.lat);
        resolvedLng = String(geo.lng);
        resolvedLocation = geo.locationLabel;
      } catch (err) {
        els.banners.innerHTML = `<div class="banner error">Couldn't find location "${place}": ${err.message}</div>`;
        els.searchBtn.disabled = false;
        els.searchBtn.textContent = 'Find showtimes';
        return;
      }
      // Swap place for resolved coords + label in params.
      params.delete('place');
      params.set('lat', resolvedLat);
      params.set('lng', resolvedLng);
      params.set('location', resolvedLocation);
    }

    // Regal split out into its own request (see /api/search-regal) --
    // its retry-with-delays logic can make it noticeably slower than
    // every other chain, so it shouldn't hold up showing everything
    // else. Only fire it if Regal's chain chip is actually on.
    const wantsRegal = activeChains.includes('regal');
    const regalParams = new URLSearchParams({
      movie, radiusMin: radius, deadline,
      date: els.searchDate.value,
      clientTime,
      formats: activeFormats.join(','),
    });
    if (resolvedLat && resolvedLng) {
      regalParams.set('lat', resolvedLat);
      regalParams.set('lng', resolvedLng);
      if (resolvedLocation) regalParams.set('location', resolvedLocation);
    } else {
      regalParams.set('place', place);
    }

    // Regal streams results via SSE (EventSource) so cards appear as each
    // performance finishes pricing -- no waiting for all to complete first.
    const regalDonePromise = wantsRegal ? new Promise((resolve) => {
      const regalResults = [];
      regalEs = new EventSource(`/api/search-regal?${regalParams.toString()}`);

      regalEs.addEventListener('result', (e) => {
        try {
          const result = JSON.parse(e.data);
          if (timingFirstRegal === null) { timingFirstRegal = Date.now(); renderTiming(false); }
          regalResults.push(result);
          // Filter Regal results out of lastRenderData each time so we don't
          // double-count cards from previous SSE events (renderResults updates
          // lastRenderData, which would otherwise accumulate Regal results).
          const nonRegalBase = (lastRenderData?.results || []).filter((r) => r.chain !== 'regal');
          const merged = {
            ...(lastRenderData || {}),
            results: [...nonRegalBase, ...regalResults],
          };
          merged.results.sort((a, b) => {
            const pa = effectivePriceForSorting(a), pb = effectivePriceForSorting(b);
            if (pa == null && pb == null) return 0;
            if (pa == null) return 1;
            if (pb == null) return -1;
            return pa - pb;
          });
          merged.matchingShowings = (merged.matchingShowings ?? merged.results.length);
          renderResults(merged, lastRenderOpts);
        } catch (err) {
          console.error('Regal SSE result parse error:', err);
        }
      });

      regalEs.addEventListener('done', () => {
        timingDone = Date.now();
        renderTiming(true);
        regalEs.close();
        regalEs = null;
        resolve(regalResults);
      });

      regalEs.onerror = (err) => {
        console.error('Regal SSE connection error:', err);
        regalEs.close();
        regalEs = null;
        resolve(regalResults); // surface whatever arrived before the error
      };
    }) : Promise.resolve(null);

    try {
      const res = await fetch(`/api/search?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        els.banners.innerHTML = `<div class="banner error">${data.error || 'Search failed'}${data.detail ? ' -- ' + data.detail : ''}</div>`;
        els.statusLine.textContent = '';
        return;
      }

      timingFirstResults = Date.now();
      renderTiming(false);
      renderResults(data);

      // Regal's results, if requested, merge in whenever they're ready --
      // completely independent of whether the block above already
      // rendered. A small "still checking" note shows in the meantime so
      // it's clear more might still be coming, not that the search is
      // simply done.
      if (wantsRegal) {
        regalStillChecking = true;
        renderResults(lastRenderData, lastRenderOpts); // re-render to show the "Checking Regal..." banner

        regalDonePromise.then((regalResults) => {
          regalStillChecking = false;
          renderResults(lastRenderData, lastRenderOpts); // re-render to remove the banner
          notifySearchComplete((lastRenderData?.results?.length ?? 0));
        });
      }
    } catch (err) {
      els.banners.innerHTML = `<div class="banner error">Couldn't reach the server. Is ./start.sh still running? (${err.message})</div>`;
      els.statusLine.textContent = '';
    } finally {
      els.searchBtn.disabled = false;
      els.searchBtn.textContent = searchMode === 'window' ? 'Find what fits' : 'Find showtimes';
      if (!wantsRegal) { timingDone = Date.now(); renderTiming(true); notifySearchComplete(lastRenderData?.results?.length ?? 0); }
    }
  }

  async function runWindowSearch() {
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();
    const availableFrom = els.availableFrom.value.trim();
    const hours = parseFloat(els.availableForHours.value);

    els.banners.innerHTML = '';
    els.results.innerHTML = '';
    activeResultFormats = new Set(); seenResultFormats = new Set(); // fresh search -- reset to "all formats on"
    activeResultChains = new Set(); seenResultChains = new Set(); // fresh search -- reset to "all chains on"

    if (((!lat || !lng) && !place) || !radius || !availableFrom || !hours) {
      els.banners.innerHTML = '<div class="banner error">Fill in location, radius, "free from" time, and how many hours before searching.</div>';
      return;
    }

    saveCurrent();

    // Compute an explicit end clock time from "free from" + duration --
    // the backend takes two clock times, not a duration, and this keeps
    // that contract simple. Doesn't handle crossing midnight (see the
    // matching note in server.js).
    const [fromH, fromM] = availableFrom.split(':').map(Number);
    const totalMinutes = fromH * 60 + fromM + Math.round(hours * 60);
    const untilH = Math.floor(totalMinutes / 60) % 24;
    const untilM = totalMinutes % 60;
    const availableUntil = `${String(untilH).padStart(2, '0')}:${String(untilM).padStart(2, '0')}`;

    if (totalMinutes >= 24 * 60) {
      els.banners.innerHTML = '<div class="banner error">That window runs past midnight, which isn\'t supported yet -- try a shorter duration or a later start time.</div>';
      return;
    }

    const activeFormats = [...document.querySelectorAll('#formatChips .chip.on')].map((c) => c.dataset.format);
    const activeChains = [...document.querySelectorAll('#chainChips .chip.on')].map((c) => c.dataset.chain);

    const params = new URLSearchParams({
      radiusMin: radius,
      availableFrom,
      availableUntil,
      date: els.searchDate.value,
      formats: activeFormats.join(','),
      chains: activeChains.join(','),
    });
    if (lat && lng) {
      params.set('lat', lat);
      params.set('lng', lng);
    } else {
      params.set('place', place);
    }

    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching...';
    els.statusLine.textContent = 'Checking what fits nearby...';

    try {
      const res = await fetch(`/api/window-search?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        els.banners.innerHTML = `<div class="banner error">${data.error || 'Search failed'}${data.detail ? ' -- ' + data.detail : ''}</div>`;
        els.statusLine.textContent = '';
        return;
      }

      renderResults(data, { showMovieName: true });
    } catch (err) {
      els.banners.innerHTML = `<div class="banner error">Couldn't reach the server. Is ./start.sh still running? (${err.message})</div>`;
      els.statusLine.textContent = '';
    } finally {
      els.searchBtn.disabled = false;
      els.searchBtn.textContent = 'Find what fits';
      notifySearchComplete(lastRenderData?.results?.length ?? 0);
    }
  }

  function notifySearchComplete(resultCount) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible') return; // already on the tab, no need
    const body = resultCount > 0
      ? `${resultCount} showing${resultCount === 1 ? '' : 's'} found`
      : 'No showings found for your search';
    new Notification('Showtime Finder', { body, icon: '/favicon.ico' });
  }

  // Format filter state -- persists across re-renders triggered by
  // clicking a chip (so toggling doesn't lose your other selections),
  // but gets reset to "all on" whenever a genuinely new search runs
  // (see the reset calls in runSearch/runWindowSearch).
  let activeResultFormats = new Set(); // starts empty; renderResults() populates it as new formats are seen

  // Post-search chain filter -- same pattern as activeResultFormats
  // above (any subset can be on, resets to "all on" for a genuinely new
  // search), but a separate Set since a person may want, say, only
  // Standard format AND only AMC/Regal at the same time -- these are
  // two independent filters over the same result set, not one combined
  // control.
  let activeResultChains = new Set(); // starts empty; renderResults() populates it as new chains are seen

  // Tracks every format/chain value ever seen THIS search (not just
  // what's currently active) -- see the long comment in renderResults
  // for why this exists: without it, a value that arrives on a LATER
  // merge (Regal's results specifically, which fetch separately and
  // finish after the main search) would never get added to the active
  // Set and would silently read as "toggled off" despite the user never
  // touching it.
  let seenResultFormats = new Set();
  let seenResultChains = new Set();

  const CHAIN_DISPLAY_NAMES = {
    amc: "AMC",
    regal: "Regal",
    cinemark: "Cinemark",
    cinemawest: "Cinema West",
    harkins: "Harkins",
    regency: "Regency",
    alamo: "Alamo Drafthouse",
    marcus: "Marcus",
    landmark: "Landmark",
    other: "Other",
  };

  // Sort mode for the already-rendered result set -- purely client-side,
  // same instant-no-refetch pattern as the format filter above, since
  // every result already carries distanceMin from the server and price
  // sorting was already happening server-side. "Cheapest" price and
  // "closest" distance are independent orderings of the same data, not
  // something that needs a new search.
  let resultSortMode = 'price'; // 'price' | 'distance'
  let showBasePriceOnly = false; // when true, sort/display uses pre-fee ticket price
  let sortByDiscountPrice = true; // when true, AMC Stubs / Regency Tuesday prices are used for sort order

  function buildCardHtml(r, isBest, opts) {
    // Field name differs by chain: AMC/Regal set estimatedFee (a guess,
    // since neither's real data exposes an exact fee), Cinemark/Cinema
    // West set fee (confirmed real, straight from the same per-showing
    // data as the price itself). Check both.
    const fee = r.fee ?? r.estimatedFee;
    const hasBreakdown = r.priceBeforeFee != null && fee != null;
    const feeIsEstimated = r.feeStatus === "estimated";

    function formatMoneyRange(low, high) {
      const lowStr = `$${low.toFixed(2)}`;
      const highStr = `$${high.toFixed(2)}`;
      return lowStr === highStr ? lowStr : `${lowStr}-${highStr}`;
    }

    const displayPrice = (showBasePriceOnly && r.priceBeforeFee != null) ? r.priceBeforeFee : r.price;
    const priceHtml = displayPrice != null
      ? `<span class="price">$${displayPrice.toFixed(2)}</span>` +
        (hasBreakdown && !showBasePriceOnly
          ? `<div class="price-breakdown">$${r.priceBeforeFee.toFixed(2)} + $${fee.toFixed(2)} fee${feeIsEstimated ? ' (est.)' : ''}</div>`
          : hasBreakdown && showBasePriceOnly
          ? `<div class="price-breakdown" style="color:var(--ink-dim);">+$${fee.toFixed(2)} fee${feeIsEstimated ? ' (est.)' : ''}</div>`
          : '') +
        (r.amcStubsDiscountPriceInPersonLow != null
          ? `<div class="stubs-stub">
               <div class="stubs-label">Stubs A-List / Premiere</div>
               <div class="stubs-row">
                 <span class="stubs-venue">In-person</span>
                 <span class="stubs-amt">~${formatMoneyRange(r.amcStubsDiscountPriceInPersonLow, r.amcStubsDiscountPriceInPersonHigh)}</span>
               </div>
               <div class="stubs-row">
                 <span class="stubs-venue">Online</span>
                 <span class="stubs-amt">~${formatMoneyRange(r.amcStubsDiscountPriceOnlineLow, r.amcStubsDiscountPriceOnlineHigh)}</span>
               </div>
             </div>`
          : '') +
        (r.regencyTuesdayPrice != null
          ? `<div class="stubs-stub">
               <div class="stubs-label">Tuesday flat rate</div>
               <div class="stubs-row"><span class="stubs-amt stubs-amt-solo">$${r.regencyTuesdayPrice.toFixed(2)}</span></div>

             </div>`
          : '') +
        (r.landmarkAlternatePrices?.length
          ? `<div class="stubs-stub">
               ${r.landmarkAlternatePrices.map((t) =>
                 `<div class="stubs-row"><span class="stubs-venue">${escapeHtml(t.label)}</span><span class="stubs-amt">$${t.total.toFixed(2)}</span></div>`
               ).join('')}
             </div>`
          : '')
      : `<span class="price unknown">Check<br/>theater</span>`;
    return `
      <div class="card ${isBest ? 'best' : ''}">
        <div class="price-col">
          ${priceHtml}
          ${isBest ? '<span class="best-tag">Cheapest</span>' : ''}
        </div>
        <div class="card-body">
          <div class="card-top">
            <span class="theater-name">${escapeHtml(r.theaterName)}</span>
            <span class="dist">${r.distanceMin} min away</span>
          </div>
          ${opts.showMovieName ? `<div class="movie-name" style="font-weight:600; margin-bottom:2px;">${escapeHtml(r.movieName)}${r.runtimeMinutes ? ` <span style="font-weight:400; color:#888; font-size:12px;">(${r.runtimeMinutes} min)</span>` : ''}</div>` : ''}
          <div class="time-large">${fmtTime24to12FromRaw(r.startTime)}</div>
          ${(r.filmActuallyStartsAt || r.estimatedEndTime) ? `<div class="time-sub">${r.filmActuallyStartsAt ? `Skip trailers, arrive ${escapeHtml(r.filmActuallyStartsAt)}` : ''}${r.filmActuallyStartsAt && r.estimatedEndTime ? ' &middot; ' : ''}${r.estimatedEndTime ? `Done by ${escapeHtml(r.estimatedEndTime)}` : ''}</div>` : ''}
          <div class="meta">
            <span class="format-badge"${getFormatDescription(r.format) ? ` title="${escapeHtml(getFormatDescription(r.format))}"` : ''}>${escapeHtml(r.format)}</span>
            ${r.ticketTypeName ? `<span class="format-badge" style="opacity:0.75;" title="This chain's own real ticket tier for this exact showing, not a guessed rule">${escapeHtml(r.ticketTypeName)}</span>` : ''}
          </div>
          ${r.bookingLink ? `<a class="card-link" href="${r.bookingLink}" target="_blank" rel="noopener">Check showtime / tickets &rarr;</a>` : ''}
          ${r.priceSource ? `<div class="price-source">Price source: ${escapeHtml(r.priceSource)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function toggleResultFormat(format) {
    // Solo-select behavior: if every known format is currently on (the
    // default/unfiltered state), clicking one solos it instead of just
    // adding to an already-full set -- otherwise a first click would do
    // nothing visible (it's already on). Once something's been solo'd,
    // subsequent clicks toggle normally (add/remove), since the set is
    // no longer "everything."
    const allOn = activeResultFormats.size === seenResultFormats.size;
    if (allOn) {
      activeResultFormats = new Set([format]);
    } else if (activeResultFormats.has(format)) {
      activeResultFormats.delete(format);
    } else {
      activeResultFormats.add(format);
    }
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleResultFormat = toggleResultFormat; // reachable from inline onclick handlers below

  function toggleResultChain(chain) {
    const allOn = activeResultChains.size === seenResultChains.size;
    if (allOn) {
      activeResultChains = new Set([chain]);
    } else if (activeResultChains.has(chain)) {
      activeResultChains.delete(chain);
    } else {
      activeResultChains.add(chain);
    }
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleResultChain = toggleResultChain; // reachable from inline onclick handlers below

  function setAllResultFormats(on) {
    if (on) activeResultFormats = new Set(seenResultFormats);
    else activeResultFormats = new Set();
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setAllResultFormats = setAllResultFormats;

  function setAllResultChains(on) {
    if (on) activeResultChains = new Set(seenResultChains);
    else activeResultChains = new Set();
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setAllResultChains = setAllResultChains;

  function setResultSortMode(mode) {
    if (resultSortMode === mode) return;
    resultSortMode = mode;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setResultSortMode = setResultSortMode; // reachable from inline onclick handlers below

  let lastRenderData = null;
  let lastRenderOpts = null;
  let regalEs = null;
  let regalStillChecking = false;

  // Mirrors the server-side sorting logic in server.js -- needed here
  // specifically for re-sorting after Regal's results merge in
  // separately, since the merged array isn't re-sorted server-side.
  function effectivePriceForSorting(r) {
    if (sortByDiscountPrice && r.amcStubsDiscountPriceOnlineHigh != null) return r.amcStubsDiscountPriceOnlineHigh;
    if (sortByDiscountPrice && r.regencyTuesdayPrice != null) return r.regencyTuesdayPrice;
    if (showBasePriceOnly && r.priceBeforeFee != null) return r.priceBeforeFee;
    return r.price;
  }

  function toggleSortByDiscountPrice() {
    sortByDiscountPrice = !sortByDiscountPrice;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleSortByDiscountPrice = toggleSortByDiscountPrice;

  function toggleBasePriceOnly() {
    showBasePriceOnly = !showBasePriceOnly;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleBasePriceOnly = toggleBasePriceOnly;

  function renderResults(data, opts = {}) {
    lastRenderData = data;
    lastRenderOpts = opts;

    const banners = [];
    if (data.warning) banners.push(`<div class="banner warn">${data.warning}</div>`);
    if (data.note) banners.push(`<div class="banner warn">${data.note}</div>`);
    if (data.locationResolutionError) {
      banners.push(`<div class="banner warn">Location lookup: ${data.locationResolutionError}</div>`);
    }
    if (regalStillChecking) {
      banners.push(`<div class="banner" style="margin-top:8px; font-size:12px; color:#8a8478;">Checking Regal pricing...</div>`);
    }
    els.banners.innerHTML = banners.join('');

    const allResults = data.results || [];
    const allFormats = [...new Set(allResults.map((r) => r.format).filter(Boolean))];
    const allChains = [...new Set(allResults.map((r) => r.chain).filter(Boolean))];

    // CONFIRMED REAL BUG, found from a live report: Regal's results
    // arrive in a SEPARATE, later fetch and get merged in via a second
    // renderResults() call (see the comment on regalPromise above) --
    // so by the time "regal" first appears in allChains, the `=== null`
    // initialization guard below has already fired once on the FIRST
    // render (before Regal existed) and won't fire again. "regal" would
    // then be permanently absent from activeResultChains -- not
    // deliberately toggled off, just never added -- which reads on
    // screen as an unchecked chip despite the user never touching it.
    // The exact same shape of bug exists for formats: if any chain ever
    // introduces a format that isn't already present in the first
    // batch, it would go missing the same way, for the same reason.
    //
    // Fix: track every value ever SEEN this search (not just what's
    // currently in a Set), and auto-add any genuinely new one as "on".
    // This preserves a real user toggle-off (the value stays absent
    // from activeResultFormats/Chains, but IS present in the seen set,
    // so it's not re-added) while still defaulting brand-new values
    // that show up on a later merge to visible, matching what the
    // person would reasonably expect on first seeing a new option.
    for (const f of allFormats) {
      if (!seenResultFormats.has(f)) {
        seenResultFormats.add(f);
        activeResultFormats.add(f);
      }
    }
    for (const c of allChains) {
      if (!seenResultChains.has(c)) {
        seenResultChains.add(c);
        activeResultChains.add(c);
      }
    }

    const results = allResults.filter((r) => activeResultFormats.has(r.format) && activeResultChains.has(r.chain));

    const priced = results.filter((r) => r.price != null).length;
    const totalFound = data.matchingShowings ?? allResults.length;
    const wasCapped = totalFound > allResults.length;
    const countLabel = wasCapped
      ? `<b>${results.length}</b> of <b>${totalFound}</b> showings`
      : `<b>${results.length}</b> showing${results.length === 1 ? '' : 's'}`;

    const subjectLabel = opts.showMovieName
      ? `movies that fit between <b>${fmtTime24to12(data.availableFrom)}</b> and <b>${fmtTime24to12(data.availableUntil)}</b>`
      : `of <b>${data.movie}</b>`;

    // Only meaningful for a single-movie search -- window-search mode
    // mixes many different movies with their own separate runtimes, so
    // there's no one number to show there.
    const runtimeLabel = !opts.showMovieName && data.runtimeMinutes
      ? ` <span style="color:var(--ink-dim); font-weight:400;">(${fmtRuntime(data.runtimeMinutes)})</span>`
      : '';

    const dateLabel = (() => {
      if (!data.searchDate) return '?';
      const [y, m, d] = data.searchDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    })();
    // SerpApi canonical names use "City,State,United States" with no spaces.
    // Format for display: add spaces, drop the country suffix.
    const locationDisplay = (() => {
      if (!data.locationResolved) return '(n/a)';
      const parts = data.locationResolved.split(',').map((s) => s.trim()).filter((s) => s && s !== 'United States');
      return parts.length >= 2 ? `${parts[0]}, ${parts[parts.length - 1]}` : parts.join(', ') || data.locationResolved;
    })();
    els.statusLine.innerHTML = allResults.length
      ? `${countLabel} ${subjectLabel}${runtimeLabel} on <b>${dateLabel}</b> (${priced} priced). Location resolved to: ${locationDisplay}`
      : `No ${opts.showMovieName ? 'movies fit that window' : `showings of <b>${data.movie}</b>${runtimeLabel} found within your window`} on <b>${dateLabel}</b>. Location resolved to: ${locationDisplay}`;

    // Stinger info only makes sense for a single specific movie, not the
    // "3 hours to kill" mode (which mixes many different movies) -- and
    // only worth showing at all when MediaStinger actually had info,
    // since "we don't know" isn't useful to surface every time.
    const stinger = data.mediaStinger;
    if (!opts.showMovieName && stinger && stinger.hasInfo) {
      const verdictHtml = stinger.verdict === 'STAY'
        ? `Is there something worth watching during or after the credits? <span style="color:#2a7a2a; font-weight:700;">Yes, you should STAY</span>`
        : stinger.verdict === 'LEAVE'
          ? `Is there something worth watching during or after the credits? <span style="color:#888; font-weight:700;">No, you should LEAVE</span>`
          : `<span style="font-weight:700;">Stinger info available</span>`;

      // Only worth revealing anything when there's actually something to
      // stay for -- for a LEAVE verdict (confirmed no stinger), the
      // during/after text is just "there's nothing here," which isn't
      // worth a spoiler-hidden reveal at all. Just the verdict and a
      // link to the full page.
      const hasSpoilerText = stinger.verdict === 'STAY' && (stinger.afterCredits || stinger.duringCredits);
      const spoilerHtml = hasSpoilerText
        ? `<details style="margin-top:6px;">
             <summary style="cursor:pointer; color:#7a6a30; font-size:13px;">Click to see what happens</summary>
             <div style="margin-top:6px; font-size:13px;">
               ${stinger.duringCredits ? `<div><b>During credits:</b> ${escapeHtml(stinger.duringCredits)}</div>` : ''}
               ${stinger.afterCredits ? `<div style="margin-top:4px;"><b>After credits:</b> ${escapeHtml(stinger.afterCredits)}</div>` : ''}
             </div>
           </details>`
        : '';

      const ratingHtml = stinger.communityRating != null
        ? ` <span style="color:#888; font-size:12px;">(community: ${stinger.communityRating > 0 ? '+' : ''}${stinger.communityRating})</span>`
        : '';
      const linkHtml = stinger.pageUrl
        ? ` <a href="${stinger.pageUrl}" target="_blank" rel="noopener" style="font-size:12px; white-space:nowrap;">Full details &rarr;</a>`
        : '';

      els.statusLine.innerHTML += `<div class="banner" style="margin-top:8px; background:#fff8e6; border:1px solid #f0dca0;">🍿 ${verdictHtml}${ratingHtml}${linkHtml}${spoilerHtml}</div>`;
    }

    if (allResults.length === 0) {
      const emptyMsg = opts.showMovieName
        ? 'Nothing fits that exact window -- try a longer duration, a wider radius, or a different start time.'
        : 'Nothing fits that window right now -- try widening the radius, pushing the deadline later, or double-checking the movie title.';
      els.results.innerHTML = `<div class="empty">${emptyMsg}</div>`;
      return;
    }

    // Instant client-side format filter -- toggles which of the already-
    // fetched results are shown, no re-search. Only rendered when there's
    // more than one distinct format to actually choose between.
    const allFormatsOn = activeResultFormats.size === seenResultFormats.size;
    const filterChipsHtml = allFormats.length > 1
      ? `<details class="filter-section" ${!allFormatsOn ? 'open' : ''}>
          <summary>
            <span class="filter-label"><span class="filter-chevron">▶</span>Formats</span>
            <span class="filter-status">${allFormatsOn ? 'All' : `${activeResultFormats.size} of ${seenResultFormats.size}`}
              &nbsp;<span style="cursor:pointer;" onclick="event.preventDefault();${allFormatsOn ? 'setAllResultFormats(false)' : 'setAllResultFormats(true)'}">${allFormatsOn ? 'none' : 'all'}</span>
            </span>
          </summary>
          <div class="filter-body"><div class="chips">${allFormats.map((f) => {
            const on = activeResultFormats.has(f);
            return `<button class="chip ${on ? 'on' : ''}" onclick="toggleResultFormat(${JSON.stringify(f).replace(/"/g, '&quot;')})">${escapeHtml(f)}</button>`;
          }).join('')}</div></div>
        </details>`
      : '';

    const allChainsOn = activeResultChains.size === seenResultChains.size;
    const chainChipsHtml = allChains.length > 1
      ? `<details class="filter-section" ${!allChainsOn ? 'open' : ''}>
          <summary>
            <span class="filter-label"><span class="filter-chevron">▶</span>Chains</span>
            <span class="filter-status">${allChainsOn ? 'All' : `${activeResultChains.size} of ${seenResultChains.size}`}
              &nbsp;<span style="cursor:pointer;" onclick="event.preventDefault();${allChainsOn ? 'setAllResultChains(false)' : 'setAllResultChains(true)'}">${allChainsOn ? 'none' : 'all'}</span>
            </span>
          </summary>
          <div class="filter-body"><div class="chips">${allChains.map((c) => {
            const on = activeResultChains.has(c);
            const label = CHAIN_DISPLAY_NAMES[c] || c;
            return `<button class="chip ${on ? 'on' : ''}" onclick="toggleResultChain(${JSON.stringify(c).replace(/"/g, '&quot;')})">${escapeHtml(label)}</button>`;
          }).join('')}</div></div>
        </details>`
      : '';

    // Sort toggle -- always rendered (unlike the format chips, which
    // only show up when there's more than one format to choose from),
    // since distance-vs-price is a meaningful choice regardless of how
    // many formats are in the result set. Uses .sort-toggle, NOT
    // .chips/.chip -- see the CSS comment above .sort-toggle for why
    // this needed a visually distinct control rather than matching the
    // format/chain filter chips.
    const hasAnyFeeBreakdown = allResults.some((r) => r.priceBeforeFee != null && (r.fee ?? r.estimatedFee) != null);
    const hasAnyDiscountPrice = allResults.some((r) => r.amcStubsDiscountPriceOnlineHigh != null || r.regencyTuesdayPrice != null || r.landmarkAlternatePrices?.length);
    const sortToggleHtml = `<div style="margin-bottom:12px; display:flex; flex-wrap:wrap; align-items:center; gap:12px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Sort:</span>
        <div class="sort-toggle">
          <button class="${resultSortMode === 'price' ? 'on' : ''}" onclick="setResultSortMode('price')">Cheapest first</button>
          <button class="${resultSortMode === 'distance' ? 'on' : ''}" onclick="setResultSortMode('distance')">Closest first</button>
        </div>
      </div>
      ${hasAnyFeeBreakdown ? `<div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Prices:</span>
        <div class="sort-toggle">
          <button class="${!showBasePriceOnly ? 'on' : ''}" onclick="toggleBasePriceOnly()">With fees</button>
          <button class="${showBasePriceOnly ? 'on' : ''}" onclick="toggleBasePriceOnly()">Base only</button>
        </div>
      </div>` : ''}
      ${hasAnyDiscountPrice ? `<div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Discounts:</span>
        <div class="sort-toggle">
          <button class="${sortByDiscountPrice ? 'on' : ''}" onclick="toggleSortByDiscountPrice()">Included</button>
          <button class="${!sortByDiscountPrice ? 'on' : ''}" onclick="toggleSortByDiscountPrice()">Ignored</button>
        </div>
      </div>` : ''}
    </div>`;

    if (results.length === 0) {
      els.results.innerHTML = filterChipsHtml + chainChipsHtml + sortToggleHtml + '<div class="empty">No showings match the selected format(s)/chain(s) -- try enabling more above.</div>';
      return;
    }

    // Always sort a copy -- overflow items appended client-side aren't
    // pre-sorted by the server, so price mode needs an explicit sort too.
    const displayResults = [...results].sort((a, b) => {
      if (resultSortMode === 'distance') {
        const da = a.distanceMin, db = b.distanceMin;
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      }
      const pa = effectivePriceForSorting(a), pb = effectivePriceForSorting(b);
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return pa - pb;
    });

    // The "Cheapest" tag has to identify the true cheapest result by
    // PRICE, regardless of what order it's currently being displayed
    // in -- findIndex on the first priced entry only worked because
    // results used to always arrive price-sorted from the server. Once
    // distance mode can reorder the same array, that assumption breaks,
    // so find the minimum explicitly instead of relying on order.
    let cheapestResult = null;
    for (const r of displayResults) {
      if (r.price == null) continue;
      if (cheapestResult == null || r.price < cheapestResult.price) cheapestResult = r;
    }

    // Default view: only show showings starting within 6 hours of the deadline.
    // Earlier showings are hidden behind a "show more" toggle so the default
    // view stays focused on actionable options close to "now + runtime".
    const deadlineVal = els.deadline && els.deadline.value;
    const EARLY_WINDOW_HOURS = 6;
    let earlyResults = [];
    let lateResults = displayResults;
    if (deadlineVal) {
      const [dh, dm] = deadlineVal.split(':').map(Number);
      const deadlineMin = dh * 60 + (dm || 0);
      const cutoffMin = deadlineMin - EARLY_WINDOW_HOURS * 60;
      const startMin = (r) => {
        const t = r.startTime || '';
        const [sh, sm] = t.split(':').map(Number);
        return sh * 60 + (sm || 0);
      };
      earlyResults = displayResults.filter((r) => startMin(r) < cutoffMin);
      lateResults = displayResults.filter((r) => startMin(r) >= cutoffMin);
    }

    const overflow = data.regalOverflow || [];
    const overflowByTheater = {};
    for (const r of overflow) {
      (overflowByTheater[r.theaterName] = overflowByTheater[r.theaterName] || []).push(r);
    }
    const overflowHtml = overflow.length
      ? Object.entries(overflowByTheater).map(([theater, showings]) =>
          `<div class="overflow-banner">
            ${escapeHtml(theater)}: ${showings.length} more showing${showings.length === 1 ? '' : 's'} within your window &mdash;
            <button class="overflow-reveal-btn" onclick="window.showRegalOverflow(this, ${escapeHtml(JSON.stringify(showings)).replace(/"/g, '&quot;')})">Fetch prices &amp; show</button>
          </div>`
        ).join('')
      : '';

    const earlyHtml = earlyResults.length
      ? `<div id="early-showings-wrap" style="margin-top:8px;">
           <button id="early-toggle-btn" class="overflow-reveal-btn" style="font-size:12px; padding:5px 10px;"
             onclick="(function(btn){
               const list = document.getElementById('early-showings-list');
               const hidden = list.style.display === 'none';
               list.style.display = hidden ? '' : 'none';
               btn.textContent = hidden ? 'Hide earlier showings' : 'Show ${earlyResults.length} earlier showing${earlyResults.length === 1 ? '' : 's'}';
             })(this)">
             Show ${earlyResults.length} earlier showing${earlyResults.length === 1 ? '' : 's'}
           </button>
           <div id="early-showings-list" style="display:none;">
             <div class="list">${earlyResults.map((r) => buildCardHtml(r, r === cheapestResult, opts)).join('')}</div>
           </div>
         </div>`
      : '';

    els.results.innerHTML = filterChipsHtml + chainChipsHtml + sortToggleHtml +
      earlyHtml +
      `<div class="list">${lateResults.map((r) =>
        buildCardHtml(r, r === cheapestResult, opts)
      ).join('')}</div>` + overflowHtml;
  }

  window.showRegalOverflow = async function(btn, showings) {
    btn.disabled = true;
    btn.textContent = 'Fetching prices...';

    const movie = lastRenderData && lastRenderData.movie;
    const dateISO = lastRenderData && lastRenderData.searchDate;

    const priced = await Promise.all(showings.map(async (r) => {
      if (!r.performanceId || !r.cinemaCode || !movie || !dateISO) return r;
      try {
        const params = new URLSearchParams({
          cinemaCode: r.cinemaCode,
          performanceId: r.performanceId,
          movie,
          dateISO,
          startTime: r.startTime,
          format: r.format || 'Standard',
          ...(r.movieId ? { movieId: r.movieId } : {}),
        });
        const data = await fetch(`/api/price-regal-showing?${params}`).then((res) => res.json());
        if (data.price != null) {
          return { ...r, price: data.price, priceBeforeFee: data.priceBeforeFee, estimatedFee: data.estimatedFee,
            feeStatus: data.feeStatus, bookingLink: data.bookingLink || r.bookingLink, format: data.format || r.format };
        }
      } catch (_) {}
      return r;
    }));

    if (lastRenderData) {
      lastRenderData = {
        ...lastRenderData,
        results: [...(lastRenderData.results || []), ...priced],
        regalOverflow: (lastRenderData.regalOverflow || []).filter(
          (r) => !showings.some((s) => s.theaterName === r.theaterName && s.startTime === r.startTime)
        ),
      };
    }
    renderResults(lastRenderData, lastRenderOpts);
  };

  // startTime from the API is already a 12-hour string like "7:00pm" in
  // most cases (SerpApi's format) -- pass through as-is, just tidy casing.
  function fmtTime24to12FromRaw(t) {
    if (!t) return '';
    return t.replace(/am|pm/i, (m) => m.toUpperCase());
  }

  function truncate(str, maxLen) {
    if (!str || str.length <= maxLen) return str;
    return str.slice(0, maxLen).trim() + '...';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Plain-language descriptions for premium/specialty screen formats,
  // shown as a hover tooltip on the format badge.
  //
  // CONFIRMED REAL BUG in the first version of this, caught from a live
  // report: it matched the ENTIRE normalized badge against one exact
  // dictionary key, so only a badge that was purely "4DX" (nothing
  // else) ever matched anything. Real Cinemark badges are routinely
  // compound combos -- "XD Luxury Lounger RealD 3D D-BOX", "Luxury
  // Lounger D-BOX" -- and a fully-concatenated exact match can never
  // equal a single dictionary entry. Rewritten to check whether each
  // known keyword/phrase appears ANYWHERE in the badge, and to combine
  // every match into one tooltip when a badge genuinely bundles several
  // real features together, rather than silently picking one and
  // hiding the rest. Also adds "Luxury Lounger" itself, missing from
  // the first version despite being a real, independently-occurring
  // feature (seen both combined with D-BOX and on its own).
  //
  // Normalizes by turning non-alphanumeric characters into SPACES
  // (not deleting them) so multi-word phrases stay distinguishable --
  // "D-BOX" becomes "d box", "Dolby Cinema" becomes "dolby cinema" --
  // rather than collapsing everything into one unbroken blob where a
  // phrase like "luxury lounger" could never be matched as two words.
  const FORMAT_DESCRIPTIONS = [
    { match: 'dolby cinema', text: 'Dolby Vision laser projection (extreme brightness and contrast) paired with Dolby Atmos surround sound and specially designed reclining seats.' },
    { match: 'rpx', text: "Regal's premium large-format screen: a bigger curved screen, upgraded picture quality, and a more powerful surround sound system." },
    { match: 'xd', text: 'A premium large-format screen with an oversized curved image and a stronger sound system than a standard auditorium.' },
    { match: '4dx', text: 'Motion seats that tilt and move in sync with on-screen action, plus environmental effects like wind, mist, and scent.' },
    { match: 'lg led', text: "A premium screen using LG's direct-view LED display instead of a projector -- brighter image and deeper blacks, without needing a dark projection booth." },
    // Two spelling variants seen in real use -- "D-BOX" (hyphen becomes
    // a space after normalization) and the unhyphenated "DBOX".
    { match: 'd box', text: 'Motion seating that moves in sync with the on-screen action -- similar in spirit to 4DX, but without the added environmental effects like wind or scent.' },
    { match: 'dbox', text: 'Motion seating that moves in sync with the on-screen action -- similar in spirit to 4DX, but without the added environmental effects like wind or scent.' },
    { match: 'luxury lounger', text: 'Extra-wide, plush reclining lounge seating -- a comfort upgrade on its own, distinct from D-BOX\'s motorized motion seating (though some auditoriums combine both).' },
    { match: 'screenx', text: 'A 270° panoramic format that extends the image onto the left and right walls of the auditorium -- no glasses required. Available only at select Regal locations.' },
  ];

  function getFormatDescription(format) {
    const normalized = (format || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
    if (!normalized) return null;

    const matched = [];
    const seenText = new Set(); // avoid double-counting "d box" and "dbox" both hitting the same badge
    for (const { match, text } of FORMAT_DESCRIPTIONS) {
      if (normalized.includes(match) && !seenText.has(text)) {
        matched.push(text);
        seenText.add(text);
      }
    }
    return matched.length ? matched.join('\n\n') : null;
  }

  function runCurrentModeSearch() {
    return searchMode === 'window' ? runWindowSearch() : runSearch();
  }

  els.searchBtn.addEventListener('click', runCurrentModeSearch);
  [els.movie, els.place, els.availableFrom, els.availableForHours].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') runCurrentModeSearch(); });
  });
</script>
</body>
</html>
