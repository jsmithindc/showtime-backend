    'chain+format+time': 'this chain, same format and time of day',
    'chain+format': 'this chain, same format',
    'chain': 'this chain',
  };
  function estimateTooltip(r) {
    const where = ESTIMATE_BASIS_TEXT[r.estimateBasis] || 'similar showings';
    const range = (r.estimatedPriceLow != null && r.estimatedPriceHigh != null && r.estimatedPriceLow !== r.estimatedPriceHigh)
      ? ` Observed range $${r.estimatedPriceLow.toFixed(2)}-$${r.estimatedPriceHigh.toFixed(2)}.`
      : '';
    return `NOT a real price. This theater's pricing couldn't be read for this showing, so this is the average of `
      + `${r.estimateObservations} price${r.estimateObservations === 1 ? '' : 's'} previously pulled for ${where}.${range}`
      + ` Check the theater before relying on it.`;
  }

  function buildCardHtml(r, isBest, opts) {
    // Field name differs by chain: AMC/Regal set estimatedFee (a guess,
    // since neither's real data exposes an exact fee), Cinemark/Cinema
    // West set fee (confirmed real, straight from the same per-showing
    // data as the price itself). Check both.
    const fee = r.fee ?? r.estimatedFee;
    const hasBreakdown = r.priceBeforeFee != null && fee != null;
    const feeIsEstimated = r.feeStatus === "estimated";

    function formatMoneyRange(low, high) {
      const lowStr = `$${low.toFixed(2)}`;
      const highStr = `$${high.toFixed(2)}`;
      return lowStr === highStr ? lowStr : `${lowStr}-${highStr}`;
    }

    const displayPrice = (showBasePriceOnly && r.priceBeforeFee != null) ? r.priceBeforeFee : r.price;
    const priceHtml = displayPrice != null
      ? `<span class="price">$${displayPrice.toFixed(2)}</span>` +
        (hasBreakdown && !showBasePriceOnly
          ? `<div class="price-breakdown">$${r.priceBeforeFee.toFixed(2)} + $${fee.toFixed(2)} fee${feeIsEstimated ? ' (est.)' : ''}</div>`
          : hasBreakdown && showBasePriceOnly
          ? `<div class="price-breakdown" style="color:var(--ink-dim);">+$${fee.toFixed(2)} fee${feeIsEstimated ? ' (est.)' : ''}</div>`
          : '') +
        (r.amcStubsDiscountPriceInPersonLow != null
          ? `<div class="stubs-stub">
               <div class="stubs-label">Stubs A-List / Premiere</div>
               <div class="stubs-row">
                 <span class="stubs-venue">In-person</span>
                 <span class="stubs-amt">~${formatMoneyRange(r.amcStubsDiscountPriceInPersonLow, r.amcStubsDiscountPriceInPersonHigh)}</span>
               </div>
               <div class="stubs-row">
                 <span class="stubs-venue">Online</span>
                 <span class="stubs-amt">~${formatMoneyRange(r.amcStubsDiscountPriceOnlineLow, r.amcStubsDiscountPriceOnlineHigh)}</span>
               </div>
             </div>`
          : '') +
        (r.regencyTuesdayPrice != null
          ? `<div class="stubs-stub">
               <div class="stubs-label">Tuesday flat rate</div>
               <div class="stubs-row"><span class="stubs-amt stubs-amt-solo">$${r.regencyTuesdayPrice.toFixed(2)}</span></div>

             </div>`
          : '') +
        (r.landmarkAlternatePrices?.length
          ? `<div class="stubs-stub">
               ${r.landmarkAlternatePrices.map((t) =>
                 `<div class="stubs-row"><span class="stubs-venue">${escapeHtml(t.label)}</span><span class="stubs-amt">$${t.total.toFixed(2)}</span></div>`
               ).join('')}
             </div>`
          : '')
      : r.estimatedPrice != null
        ? `<span class="price estimated" title="${escapeHtml(estimateTooltip(r))}">~$${r.estimatedPrice.toFixed(2)}</span>` +
          `<div class="price-breakdown estimated-note" title="${escapeHtml(estimateTooltip(r))}">estimate</div>`
        : `<span class="price unknown">Check<br/>theater</span>`;
    return `
      <div class="card ${isBest ? 'best' : ''} ${opts.showMovieName ? 'window-mode' : ''}">
        <div class="price-col">
          ${priceHtml}
          ${isBest ? '<span class="best-tag">Cheapest</span>' : ''}
        </div>
        ${opts.showMovieName && r.ratings && r.ratings.poster
          ? `<div class="poster-col">${posterHtml(r.ratings, r.movieName)}</div>` : ''}
        <div class="card-body">
          ${opts.showMovieName ? `<div class="movie-name">${escapeHtml(r.movieName)}${r.runtimeMinutes ? ` <span class="runtime">(${r.runtimeMinutes} min)</span>` : ''}</div>
          ${ratingsHtml(r.ratings)}` : ''}
          <div class="card-top">
            <span class="theater-name">${escapeHtml(r.theaterName)}</span>
            <span class="dist${searchedRadiusMin && r.distanceMin > searchedRadiusMin ? ' dist-over' : ''}"${
              searchedRadiusMin && r.distanceMin > searchedRadiusMin
                ? ` title="Just outside your ${searchedRadiusMin}-minute radius. Kept because drive times are free-flow estimates with no traffic or parking, and a minute either way is inside that margin."`
                : ''}>${r.distanceMin} min away${searchedRadiusMin && r.distanceMin > searchedRadiusMin ? ' &middot; just outside' : ''}</span>
          </div>
          <div class="time-large">${fmtTime24to12FromRaw(r.startTime)}</div>
          ${(r.filmActuallyStartsAt || r.estimatedEndTime) ? `<div class="time-sub">${r.filmActuallyStartsAt ? `Skip trailers, arrive ${escapeHtml(r.filmActuallyStartsAt)}` : ''}${r.filmActuallyStartsAt && r.estimatedEndTime ? ' &middot; ' : ''}${r.estimatedEndTime ? `Done by ${escapeHtml(r.estimatedEndTime)}` : ''}</div>` : ''}
          <div class="meta">
            <span class="format-badge"${getFormatDescription(r.format) ? ` title="${escapeHtml(getFormatDescription(r.format))}"` : ''}>${escapeHtml(r.format)}</span>
            ${r.ticketTypeName ? `<span class="format-badge" style="opacity:0.75;" title="This chain's own real ticket tier for this exact showing, not a guessed rule">${escapeHtml(r.ticketTypeName)}</span>` : ''}
          </div>
          ${opts.showMovieName ? `<button type="button" class="price-this" data-movie="${escapeHtml(r.movieName)}">Price this film &rarr;</button>` : ''}
          ${r.bookingLink ? `<a class="card-link" href="${r.bookingLink}" target="_blank" rel="noopener">Check showtime / tickets &rarr;</a>` : ''}
          ${r.priceSource ? `<div class="price-source">Price source: ${escapeHtml(r.priceSource)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function toggleResultFormat(format) {
    // Solo-select behavior: if every known format is currently on (the
    // default/unfiltered state), clicking one solos it instead of just
    // adding to an already-full set -- otherwise a first click would do
    // nothing visible (it's already on). Once something's been solo'd,
    // subsequent clicks toggle normally (add/remove), since the set is
    // no longer "everything."
    const allOn = activeResultFormats.size === seenResultFormats.size;
    if (allOn) {
      activeResultFormats = new Set([format]);
    } else if (activeResultFormats.has(format)) {
      activeResultFormats.delete(format);
    } else {
      activeResultFormats.add(format);
    }
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleResultFormat = toggleResultFormat; // reachable from inline onclick handlers below

  function toggleResultChain(chain) {
    const allOn = activeResultChains.size === seenResultChains.size;
    if (allOn) {
      activeResultChains = new Set([chain]);
    } else if (activeResultChains.has(chain)) {
      activeResultChains.delete(chain);
    } else {
      activeResultChains.add(chain);
    }
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleResultChain = toggleResultChain; // reachable from inline onclick handlers below

  function setAllResultFormats(on) {
    if (on) activeResultFormats = new Set(seenResultFormats);
    else activeResultFormats = new Set();
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setAllResultFormats = setAllResultFormats;

  function toggleResultMovie(movie) {
    // First click on a chip while everything is on means "only this one" --
    // same affordance as the format and chain chips, and the common intent
    // here: you spotted one film and want just its showtimes.
    const allOn = activeResultMovies.size === seenResultMovies.size;
    if (allOn) {
      activeResultMovies = new Set([movie]);
    } else if (activeResultMovies.has(movie)) {
      activeResultMovies.delete(movie);
    } else {
      activeResultMovies.add(movie);
    }
    renderResults(lastRenderData, lastRenderOpts);
  }

  function setAllResultMovies(on) {
    activeResultMovies = on ? new Set(seenResultMovies) : new Set();
    renderResults(lastRenderData, lastRenderOpts);
  }

  function setAllResultChains(on) {
    if (on) activeResultChains = new Set(seenResultChains);
    else activeResultChains = new Set();
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setAllResultChains = setAllResultChains;

  function setResultSortMode(mode) {
    if (resultSortMode === mode) return;
    resultSortMode = mode;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.setResultSortMode = setResultSortMode; // reachable from inline onclick handlers below

  let lastRenderData = null;
  let lastRenderOpts = null;
  let regalEs = null;
  let searchEs = null;
  let regalStillChecking = false;
  let searchStillChecking = false;

  // Mirrors the server-side sorting logic in server.js -- needed here
  // specifically for re-sorting after Regal's results merge in
  // separately, since the merged array isn't re-sorted server-side.
  function effectivePriceForSorting(r) {
    // A learned estimate participates in cheapest-first ordering -- stranding
    // it below every priced row is what made unpriced chains invisible in the
    // first place. It is still visually marked, and cannot take the Cheapest
    // badge (that check reads r.price directly).
    if (r.price == null && r.estimatedPrice != null) return r.estimatedPrice;
    // The two toggles COMPOSE -- they aren't alternatives. The discount toggle
    // used to win outright and always return the ONLINE discounted price, so
    // with "base only" + "discounts included" the list was ordered by a
    // fee-inclusive number while every card displayed the fee-free one. Cards
    // show both an In-person and an Online discounted figure; sorting has to
    // pick whichever matches the price mode currently on screen.
    if (sortByDiscountPrice) {
      if (showBasePriceOnly && r.amcStubsDiscountPriceInPersonHigh != null) {
        return r.amcStubsDiscountPriceInPersonHigh;
      }
      if (!showBasePriceOnly && r.amcStubsDiscountPriceOnlineHigh != null) {
        return r.amcStubsDiscountPriceOnlineHigh;
      }
      // Either variant, whichever exists, rather than falling through to the
      // undiscounted price and misplacing the row entirely.
      const anyDiscount = showBasePriceOnly
        ? r.amcStubsDiscountPriceOnlineHigh
        : r.amcStubsDiscountPriceInPersonHigh;
      if (anyDiscount != null) return anyDiscount;
      // A flat Tuesday rate is the same price either way -- no venue variants.
      if (r.regencyTuesdayPrice != null) return r.regencyTuesdayPrice;
    }
    if (showBasePriceOnly && r.priceBeforeFee != null) return r.priceBeforeFee;
    return r.price;
  }

  function toggleSortByDiscountPrice() {
    sortByDiscountPrice = !sortByDiscountPrice;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleSortByDiscountPrice = toggleSortByDiscountPrice;

  function toggleBasePriceOnly() {
    showBasePriceOnly = !showBasePriceOnly;
    renderResults(lastRenderData, lastRenderOpts);
  }
  window.toggleBasePriceOnly = toggleBasePriceOnly;

  function renderResults(data, opts = {}) {
    lastRenderData = data;
    lastRenderOpts = opts;

    const banners = [];
    let chainReportHtml = '';
    if (data.warning) banners.push(`<div class="banner warn">${data.warning}</div>`);
    if (data.note) banners.push(`<div class="banner warn">${data.note}</div>`);
    if (data.locationResolutionError) {
      banners.push(`<div class="banner warn">Location lookup: ${data.locationResolutionError}</div>`);
    }
    // One note for the whole search, regardless of which stream is still going.
    // This used to name Regal specifically, from when Regal pricing took ~60s
    // longer than everything else and was worth calling out. Since cart sharing
    // (v5.8.3) Regal finishes in line with the other chains -- often first --
    // so naming it told people nothing useful about how much longer to wait,
    // and risked implying the rest was already final. All the note needs to say
    // is that the list isn't finished yet.
    // Per-chain outcome. Every chain used to swallow its own failures into the
    // server log, so a chain that was completely broken looked exactly like a
    // chain with nothing playing. Collapsed by default -- it only needs to be
    // glanceable, and the summary line says whether anything went wrong.
    if (Array.isArray(data.chainReports) && data.chainReports.length > 0) {
      const NAMES = {
        amc: 'AMC', regal: 'Regal', cinemark: 'Cinemark', cinemawest: 'Cinema West',
        harkins: 'Harkins', regency: 'Regency', alamo: 'Alamo Drafthouse',
        marcus: 'Marcus', landmark: 'Landmark',
      };
      const rows = data.chainReports.map((c) => {
        const name = NAMES[c.chain] || c.chain;
        let text, color;
        if (c.status === 'ok') {
          text = `${c.showings} showing${c.showings === 1 ? '' : 's'} from ${c.theaters} theater${c.theaters === 1 ? '' : 's'}`;
          color = 'var(--ink)';
        } else if (c.status === 'failed') {
          text = `search failed${c.detail ? ' -- ' + c.detail : ''}`;
          color = 'var(--error)';
        } else if (c.status === 'no-theaters') {
          text = 'no theaters in range';
          color = 'var(--ink-dim)';
        } else {
          text = `${c.theaters} theater${c.theaters === 1 ? '' : 's'} in range, nothing matching`;
          color = 'var(--ink-dim)';
        }
        return `<div style="display:flex; gap:10px; padding:3px 0;">
            <span style="min-width:110px; color:var(--ink-dim);">${name}</span>
            <span style="color:${color};">${text}</span>
          </div>`;
      }).join('');

      const failed = data.chainReports.filter((c) => c.status === 'failed').length;
      const summary = failed > 0
        ? `Chain report -- ${failed} chain${failed === 1 ? '' : 's'} failed`
        : 'Chain report';

      // Visually set apart from the format/chain filter chips that render
      // immediately below it. Both were plain rows of small dim text, so the
      // report read as another filter control rather than as search status --
      // its own surface, border and label make the distinction obvious.
      // Held aside rather than pushed into #banners. It belongs directly under
      // the "N showings on ..." line -- it is a statement ABOUT that count
      // (which chains produced it, which found nothing, which failed) -- and
      // #banners renders after the stinger box, which put it too far down and
      // in the wrong order.
      chainReportHtml = `<details class="chain-report"${failed > 0 ? ' data-failed="1"' : ''}>
          <summary>${summary}</summary>
          <div class="chain-report-rows">${rows}</div>
        </details>`;
    }

    if (searchStillChecking || regalStillChecking) {
      banners.push(`<div class="banner" style="margin-top:8px; font-size:12px; color:#8a8478;">More results still coming in...</div>`);
    }
    els.banners.innerHTML = banners.join('');

    const allResults = data.results || [];
    const allFormats = [...new Set(allResults.map((r) => r.format).filter(Boolean))];
    const allChains = [...new Set(allResults.map((r) => r.chain).filter(Boolean))];

    // CONFIRMED REAL BUG, found from a live report: Regal's results
    // arrive in a SEPARATE, later fetch and get merged in via a second
    // renderResults() call (see the comment on regalPromise above) --
    // so by the time "regal" first appears in allChains, the `=== null`
    // initialization guard below has already fired once on the FIRST
    // render (before Regal existed) and won't fire again. "regal" would
    // then be permanently absent from activeResultChains -- not
    // deliberately toggled off, just never added -- which reads on
    // screen as an unchecked chip despite the user never touching it.
    // The exact same shape of bug exists for formats: if any chain ever
    // introduces a format that isn't already present in the first
    // batch, it would go missing the same way, for the same reason.
    //
    // Fix: track every value ever SEEN this search (not just what's
    // currently in a Set), and auto-add any genuinely new one as "on".
    // This preserves a real user toggle-off (the value stays absent
    // from activeResultFormats/Chains, but IS present in the seen set,
    // so it's not re-added) while still defaulting brand-new values
    // that show up on a later merge to visible, matching what the
    // person would reasonably expect on first seeing a new option.
    for (const f of allFormats) {
      if (!seenResultFormats.has(f)) {
        seenResultFormats.add(f);
        activeResultFormats.add(f);
      }
    }
    for (const c of allChains) {
      if (!seenResultChains.has(c)) {
        seenResultChains.add(c);
        activeResultChains.add(c);
      }
    }
    const allMovies = opts.showMovieName
      ? [...new Set(allResults.map((r) => r.movieName).filter(Boolean))].sort((a, b) =>
          a.localeCompare(b, undefined, { sensitivity: 'base' }))
      : [];
    for (const m of allMovies) {
      if (!seenResultMovies.has(m)) {
        seenResultMovies.add(m);
        activeResultMovies.add(m);
      }
    }

    const results = allResults.filter((r) =>
      activeResultFormats.has(r.format) &&
      activeResultChains.has(r.chain) &&
      // Only gates in window mode; allMovies is empty otherwise, and an empty
      // seen-set would otherwise filter every result away.
      (allMovies.length === 0 || activeResultMovies.has(r.movieName))
    );

    const priced = results.filter((r) => r.price != null).length;
    const totalFound = data.matchingShowings ?? allResults.length;
    const wasCapped = totalFound > allResults.length;
    const countLabel = wasCapped
      ? `<b>${results.length}</b> of <b>${totalFound}</b> showings`
      : `<b>${results.length}</b> showing${results.length === 1 ? '' : 's'}`;

    // "that fit", not "movies that fit": this is appended straight after
    // countLabel, which already ends in "showing(s)" -- the old wording read
    // "0 of 56 showings movies that fit between 5:00 PM and 11:00 PM".
    const subjectLabel = opts.showMovieName
      ? `that fit between <b>${fmtTime24to12(data.availableFrom)}</b> and <b>${fmtTime24to12(data.availableUntil)}</b>`
      : `of <b>${data.movie}</b>`;

    const dateLabel = (() => {
      if (!data.searchDate) return '?';
      const [y, m, d] = data.searchDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    })();
    // SerpApi canonical names use "City,State,United States" with no spaces.
    // Format for display: add spaces, drop the country suffix.
    const locationDisplay = (() => {
      if (!data.locationResolved) return '(n/a)';
      const parts = data.locationResolved.split(',').map((s) => s.trim()).filter((s) => s && s !== 'United States');
      return parts.length >= 2 ? `${parts[0]}, ${parts[parts.length - 1]}` : parts.join(', ') || data.locationResolved;
    })();
    if (opts.showMovieName) {
      // Window mode mixes many films, so there is no single title to head the
      // page with -- it keeps the one-line summary.
      els.statusLine.innerHTML = allResults.length
        ? `${countLabel} ${subjectLabel} on <b>${dateLabel}</b> (${priced} priced). Location resolved to: ${locationDisplay}`
        : `No movies fit that window on <b>${dateLabel}</b>. Location resolved to: ${locationDisplay}`;
    } else {
      els.statusLine.innerHTML = filmHeroHtml(data, {
        countLine: allResults.length
          ? `${countLabel} on <b>${dateLabel}</b> (${priced} priced) in ${locationDisplay}`
          : `No showings found within your window on <b>${dateLabel}</b> in ${locationDisplay}`,
      });
    }

    // Footer, not the header: both of these are reference material about the
    // search rather than part of the answer.
    const footerParts = [];
    if (chainReportHtml) footerParts.push(chainReportHtml);

    // Nearest true IMAX 70mm (15/70) venue. Deliberately spelled out as "70mm
    // film", because the IMAX format chip elsewhere on this page means DIGITAL
    // IMAX and someone hunting film would otherwise be misled by it.
    // The server only sends this when the searched film actually has a 70mm
    // print (see isImax70mmRelease). It is therefore always worth featuring --
    // the "where's my nearest one" question is answered on demand instead, via
    // /api/imax-70mm, because that answer is the same for every search and was
    // pure noise on the 99% of films with no 70mm run.
    const imax = data.nearestImax70mm;
    if (imax) {
      const far = imax.distanceMin > 180;
      const label = far
        ? `${Math.round(imax.distanceMin / 60)}h drive`
        : `${imax.distanceMin} min away`;
      const imaxHtml =
        `<div class="imax70 imax70-live" title="True IMAX 70mm (15/70) film projection -- not the same as the digital IMAX format shown on result cards. ${
          escapeHtml(imax.coordSource === 'geocoded' ? 'Location is approximate (geocoded to the city).' : 'Exact location from the chain\'s own theater list.')
        }">` +
          `<span class="imax70-tag">70mm film</span>` +
          `<b>${escapeHtml(data.movie || 'This film')}</b> has a 70mm print. Nearest 15/70 screen: ` +
          `<b>${escapeHtml(imax.name)}</b>, ${escapeHtml(imax.city)}, ${escapeHtml(imax.state)} ` +
          `&middot; ${label}${imax.chain ? '' : ' &middot; not searched (no adapter for this venue)'}` +
          // Firsthand seating note, where one exists. Shown rather than buried
          // in a tooltip: it is the kind of thing you want BEFORE booking, and
          // for a venue you may drive hours to, which row you pick matters
          // about as much as getting there.
          (imax.seating
            ? `<div class="imax70-seats" title="${escapeHtml(imax.seating.note || '')}">` +
                `sit in <b>row ${escapeHtml(imax.seating.best)}</b>` +
                (imax.seating.good && imax.seating.good.length
                  ? ` &middot; ${escapeHtml(imax.seating.good.join(' or '))} also good` : '') +
                (imax.seating.tooClose && imax.seating.tooClose.length
                  ? ` &middot; ${escapeHtml(imax.seating.tooClose.join('/'))} too close` : '') +
              `</div>`
            : '') +
        `</div>`;
      els.statusLine.innerHTML += imaxHtml;
    }
    els.pageFooter.innerHTML = footerParts.join('');

    // Stinger info only makes sense for a single specific movie, not the
    // "3 hours to kill" mode (which mixes many different movies) -- and
    // only worth showing at all when MediaStinger actually had info,
    // since "we don't know" isn't useful to surface every time.
    const stinger = data.mediaStinger;
    if (!opts.showMovieName && stinger && stinger.hasInfo) {
      const verdictHtml = stinger.verdict === 'STAY'
        ? `Is there something worth watching during or after the credits? <span style="color:#2a7a2a; font-weight:700;">Yes, you should STAY</span>`
        : stinger.verdict === 'LEAVE'
          ? `Is there something worth watching during or after the credits? <span style="color:#888; font-weight:700;">No, you should LEAVE</span>`
          : `<span style="font-weight:700;">Stinger info available</span>`;

      // Only worth revealing anything when there's actually something to
      // stay for -- for a LEAVE verdict (confirmed no stinger), the
      // during/after text is just "there's nothing here," which isn't
      // worth a spoiler-hidden reveal at all. Just the verdict and a
      // link to the full page.
      const hasSpoilerText = stinger.verdict === 'STAY' && (stinger.afterCredits || stinger.duringCredits);
      const spoilerHtml = hasSpoilerText
        ? `<details style="margin-top:6px;">
             <summary style="cursor:pointer; color:#7a6a30; font-size:13px;">Click to see what happens</summary>
             <div style="margin-top:6px; font-size:13px;">
               ${stinger.duringCredits ? `<div><b>During credits:</b> ${escapeHtml(stinger.duringCredits)}</div>` : ''}
               ${stinger.afterCredits ? `<div style="margin-top:4px;"><b>After credits:</b> ${escapeHtml(stinger.afterCredits)}</div>` : ''}
             </div>
           </details>`
        : '';

      const ratingHtml = stinger.communityRating != null
        ? ` <span style="color:#888; font-size:12px;">(community: ${stinger.communityRating > 0 ? '+' : ''}${stinger.communityRating})</span>`
        : '';
      const linkHtml = stinger.pageUrl
        ? ` <a href="${stinger.pageUrl}" target="_blank" rel="noopener" style="font-size:12px; white-space:nowrap;">Full details &rarr;</a>`
        : '';

      els.statusLine.innerHTML += `<div class="banner" style="margin-top:8px; background:#fff8e6; border:1px solid #f0dca0;">🍿 ${verdictHtml}${ratingHtml}${linkHtml}${spoilerHtml}</div>`;
    }

    if (allResults.length === 0) {
      const emptyMsg = opts.showMovieName
        ? 'Nothing fits that exact window -- try a longer duration, a wider radius, or a different start time.'
        : 'Nothing fits that window right now -- try widening the radius, pushing the deadline later, or double-checking the movie title.';
      els.results.innerHTML = `<div class="empty">${emptyMsg}</div>`;
      return;
    }

    // Instant client-side format filter -- toggles which of the already-
    // fetched results are shown, no re-search. Only rendered when there's
    // more than one distinct format to actually choose between.
    const allFormatsOn = activeResultFormats.size === seenResultFormats.size;
    const filterChipsHtml = allFormats.length > 1
      ? `<details class="filter-section" ${!allFormatsOn ? 'open' : ''}>
          <summary>
            <span class="filter-label"><span class="filter-chevron">▶</span>Formats</span>
            <span class="filter-status">${allFormatsOn ? 'All' : `${activeResultFormats.size} of ${seenResultFormats.size}`}
              &nbsp;<span style="cursor:pointer;" onclick="event.preventDefault();${allFormatsOn ? 'setAllResultFormats(false)' : 'setAllResultFormats(true)'}">${allFormatsOn ? 'none' : 'all'}</span>
            </span>
          </summary>
          <div class="filter-body"><div class="chips">${allFormats.map((f) => {
            const on = activeResultFormats.has(f);
            return `<button class="chip ${on ? 'on' : ''}" onclick="toggleResultFormat(${JSON.stringify(f).replace(/"/g, '&quot;')})">${escapeHtml(f)}</button>`;
          }).join('')}</div></div>
        </details>`
      : '';

    const allChainsOn = activeResultChains.size === seenResultChains.size;
    const chainChipsHtml = allChains.length > 1
      ? `<details class="filter-section" ${!allChainsOn ? 'open' : ''}>
          <summary>
            <span class="filter-label"><span class="filter-chevron">▶</span>Chains</span>
            <span class="filter-status">${allChainsOn ? 'All' : `${activeResultChains.size} of ${seenResultChains.size}`}
              &nbsp;<span style="cursor:pointer;" onclick="event.preventDefault();${allChainsOn ? 'setAllResultChains(false)' : 'setAllResultChains(true)'}">${allChainsOn ? 'none' : 'all'}</span>
            </span>
          </summary>
          <div class="filter-body"><div class="chips">${allChains.map((c) => {
            const on = activeResultChains.has(c);
            const label = CHAIN_DISPLAY_NAMES[c] || c;
            return `<button class="chip ${on ? 'on' : ''}" onclick="toggleResultChain(${JSON.stringify(c).replace(/"/g, '&quot;')})">${escapeHtml(label)}</button>`;
          }).join('')}</div></div>
        </details>`
      : '';

    const allMoviesOn = activeResultMovies.size === seenResultMovies.size;
    const movieChipsHtml = allMovies.length > 1
      ? `<details class="filter-section" ${!allMoviesOn ? 'open' : ''}>
          <summary>
            <span class="filter-label"><span class="filter-chevron">▶</span>Movies</span>
            <span class="filter-status">${allMoviesOn ? 'All' : `${activeResultMovies.size} of ${seenResultMovies.size}`}
              &nbsp;<span style="cursor:pointer;" onclick="event.preventDefault();${allMoviesOn ? 'setAllResultMovies(false)' : 'setAllResultMovies(true)'}">${allMoviesOn ? 'none' : 'all'}</span>
            </span>
          </summary>
          <div class="filter-body"><div class="chips">${allMovies.map((m) => {
            const on = activeResultMovies.has(m);
            return `<button class="chip ${on ? 'on' : ''}" onclick="toggleResultMovie(${JSON.stringify(m).replace(/"/g, '&quot;')})">${escapeHtml(m)}</button>`;
          }).join('')}</div></div>
        </details>`
      : '';

    // Sort toggle -- always rendered (unlike the format chips, which
    // only show up when there's more than one format to choose from),
    // since distance-vs-price is a meaningful choice regardless of how
    // many formats are in the result set. Uses .sort-toggle, NOT
    // .chips/.chip -- see the CSS comment above .sort-toggle for why
    // this needed a visually distinct control rather than matching the
    // format/chain filter chips.
    const hasAnyFeeBreakdown = allResults.some((r) => r.priceBeforeFee != null && (r.fee ?? r.estimatedFee) != null);
    const hasAnyDiscountPrice = allResults.some((r) => r.amcStubsDiscountPriceOnlineHigh != null || r.regencyTuesdayPrice != null || r.landmarkAlternatePrices?.length);
    const sortToggleHtml = `<div style="margin-bottom:12px; display:flex; flex-wrap:wrap; align-items:center; gap:12px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Sort:</span>
        <div class="sort-toggle">
          <button class="${resultSortMode === 'price' ? 'on' : ''}" onclick="setResultSortMode('price')">Cheapest first</button>
          <button class="${resultSortMode === 'distance' ? 'on' : ''}" onclick="setResultSortMode('distance')">Closest first</button>
        </div>
      </div>
      ${hasAnyFeeBreakdown ? `<div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Prices:</span>
        <div class="sort-toggle">
          <button class="${!showBasePriceOnly ? 'on' : ''}" onclick="toggleBasePriceOnly()">With fees</button>
          <button class="${showBasePriceOnly ? 'on' : ''}" onclick="toggleBasePriceOnly()">Base only</button>
        </div>
      </div>` : ''}
      ${hasAnyDiscountPrice ? `<div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:var(--ink-dim);">Discounts:</span>
        <div class="sort-toggle">
          <button class="${sortByDiscountPrice ? 'on' : ''}" onclick="toggleSortByDiscountPrice()">Included</button>
          <button class="${!sortByDiscountPrice ? 'on' : ''}" onclick="toggleSortByDiscountPrice()">Ignored</button>
        </div>
      </div>` : ''}
    </div>`;

    if (results.length === 0) {
      els.results.innerHTML = movieChipsHtml + filterChipsHtml + chainChipsHtml + sortToggleHtml + '<div class="empty">No showings match the selected format(s)/chain(s) -- try enabling more above.</div>';
      return;
    }

    // Always sort a copy -- overflow items appended client-side aren't
    // pre-sorted by the server, so price mode needs an explicit sort too.
    const displayResults = [...results].sort((a, b) => {
      if (resultSortMode === 'distance') {
        const da = a.distanceMin, db = b.distanceMin;
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      }
      const pa = effectivePriceForSorting(a), pb = effectivePriceForSorting(b);
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return pa - pb;
    });

    // The "Cheapest" tag has to identify the true cheapest result by
    // PRICE, regardless of what order it's currently being displayed
    // in -- findIndex on the first priced entry only worked because
    // results used to always arrive price-sorted from the server. Once
    // distance mode can reorder the same array, that assumption breaks,
    // so find the minimum explicitly instead of relying on order.
    let cheapestResult = null;
    for (const r of displayResults) {
      if (r.price == null) continue;
      if (cheapestResult == null || r.price < cheapestResult.price) cheapestResult = r;
    }

    // Default view: only show showings starting within 6 hours of the deadline.
    // Earlier showings are hidden behind a "show more" toggle so the default
    // view stays focused on actionable options close to "now + runtime".
    const deadlineVal = els.deadline && els.deadline.value;
    const EARLY_WINDOW_HOURS = 6;
    let earlyResults = [];
    let lateResults = displayResults;
    if (deadlineVal) {
      const [dh, dm] = deadlineVal.split(':').map(Number);
      const deadlineMin = dh * 60 + (dm || 0);
      const cutoffMin = deadlineMin - EARLY_WINDOW_HOURS * 60;
      const startMin = (r) => {
        const t = r.startTime || '';
        const [sh, sm] = t.split(':').map(Number);
        return sh * 60 + (sm || 0);
      };
      earlyResults = displayResults.filter((r) => startMin(r) < cutoffMin);
      lateResults = displayResults.filter((r) => startMin(r) >= cutoffMin);
    }

    const overflow = data.regalOverflow || [];
    const overflowByTheater = {};
    for (const r of overflow) {
      (overflowByTheater[r.theaterName] = overflowByTheater[r.theaterName] || []).push(r);
    }
    const overflowHtml = overflow.length
      ? Object.entries(overflowByTheater).map(([theater, showings]) =>
          `<div class="overflow-banner">
            ${escapeHtml(theater)}: ${showings.length} more showing${showings.length === 1 ? '' : 's'} within your window &mdash;
            <button class="overflow-reveal-btn" onclick="window.showRegalOverflow(this, ${escapeHtml(JSON.stringify(showings)).replace(/"/g, '&quot;')})">Fetch prices &amp; show</button>
          </div>`
        ).join('')
      : '';

    // The count is carried on the button because it changes with the active
    // filters -- the handler needs the CURRENT number to write the label.
    const earlyLabel = `Show ${earlyResults.length} earlier showing${earlyResults.length === 1 ? '' : 's'}`;
    const earlyHtml = earlyResults.length
      ? `<div id="early-showings-wrap" style="margin-top:8px;">
           <button id="early-toggle-btn" class="overflow-reveal-btn" style="font-size:12px; padding:5px 10px;"
             data-count="${earlyResults.length}" onclick="window.toggleEarlyShowings(this)">
             ${earlyShowingsExpanded ? 'Hide earlier showings' : earlyLabel}
           </button>
           <div id="early-showings-list" style="display:${earlyShowingsExpanded ? '' : 'none'};">
             <div class="list">${earlyResults.map((r) => buildCardHtml(r, r === cheapestResult, opts)).join('')}</div>
           </div>
         </div>`
      : '';

    els.results.innerHTML = movieChipsHtml + filterChipsHtml + chainChipsHtml + sortToggleHtml +
      earlyHtml +
      `<div class="list">${lateResults.map((r) =>
        buildCardHtml(r, r === cheapestResult, opts)
      ).join('')}</div>` + overflowHtml;
  }

  window.toggleEarlyShowings = function (btn) {
    earlyShowingsExpanded = !earlyShowingsExpanded;
    const list = document.getElementById('early-showings-list');
    if (list) list.style.display = earlyShowingsExpanded ? '' : 'none';
    const n = Number(btn.dataset.count) || 0;
    btn.textContent = earlyShowingsExpanded
      ? 'Hide earlier showings'
      : `Show ${n} earlier showing${n === 1 ? '' : 's'}`;
  };

  window.showRegalOverflow = async function(btn, showings) {
    btn.disabled = true;
    btn.textContent = 'Fetching prices...';

    const movie = lastRenderData && lastRenderData.movie;
    const dateISO = lastRenderData && lastRenderData.searchDate;

    const priced = await Promise.all(showings.map(async (r) => {
      if (!r.performanceId || !r.cinemaCode || !movie || !dateISO) return r;
      try {
        const params = new URLSearchParams({
          cinemaCode: r.cinemaCode,
          performanceId: r.performanceId,
          movie,
          dateISO,
          startTime: r.startTime,
          format: r.format || 'Standard',
          ...(r.movieId ? { movieId: r.movieId } : {}),
        });
        const data = await fetch(`/api/price-regal-showing?${params}`).then((res) => res.json());
        if (data.price != null) {
          return { ...r, price: data.price, priceBeforeFee: data.priceBeforeFee, estimatedFee: data.estimatedFee,
            feeStatus: data.feeStatus, bookingLink: data.bookingLink || r.bookingLink, format: data.format || r.format };
        }
      } catch (_) {}
      return r;
    }));

    if (lastRenderData) {
      lastRenderData = {
        ...lastRenderData,
        results: [...(lastRenderData.results || []), ...priced],
        regalOverflow: (lastRenderData.regalOverflow || []).filter(
          (r) => !showings.some((s) => s.theaterName === r.theaterName && s.startTime === r.startTime)
        ),
      };
    }
    renderResults(lastRenderData, lastRenderOpts);
  };

  // startTime from the API is already a 12-hour string like "7:00pm" in
  // most cases (SerpApi's format) -- pass through as-is, just tidy casing.
  function fmtTime24to12FromRaw(t) {
    if (!t) return '';
    return t.replace(/am|pm/i, (m) => m.toUpperCase());
  }

  function truncate(str, maxLen) {
    if (!str || str.length <= maxLen) return str;
    return str.slice(0, maxLen).trim() + '...';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Plain-language descriptions for premium/specialty screen formats,
  // shown as a hover tooltip on the format badge.
  //
  // CONFIRMED REAL BUG in the first version of this, caught from a live
  // report: it matched the ENTIRE normalized badge against one exact
  // dictionary key, so only a badge that was purely "4DX" (nothing
  // else) ever matched anything. Real Cinemark badges are routinely
  // compound combos -- "XD Luxury Lounger RealD 3D D-BOX", "Luxury
  // Lounger D-BOX" -- and a fully-concatenated exact match can never
  // equal a single dictionary entry. Rewritten to check whether each
  // known keyword/phrase appears ANYWHERE in the badge, and to combine
  // every match into one tooltip when a badge genuinely bundles several
  // real features together, rather than silently picking one and
  // hiding the rest. Also adds "Luxury Lounger" itself, missing from
  // the first version despite being a real, independently-occurring
  // feature (seen both combined with D-BOX and on its own).
  //
  // Normalizes by turning non-alphanumeric characters into SPACES
  // (not deleting them) so multi-word phrases stay distinguishable --
  // "D-BOX" becomes "d box", "Dolby Cinema" becomes "dolby cinema" --
  // rather than collapsing everything into one unbroken blob where a
  // phrase like "luxury lounger" could never be matched as two words.
  const FORMAT_DESCRIPTIONS = [
    { match: 'dolby cinema', text: 'Dolby Vision laser projection (extreme brightness and contrast) paired with Dolby Atmos surround sound and specially designed reclining seats.' },
    { match: 'rpx', text: "Regal's premium large-format screen: a bigger curved screen, upgraded picture quality, and a more powerful surround sound system." },
    { match: 'xd', text: 'A premium large-format screen with an oversized curved image and a stronger sound system than a standard auditorium.' },
    { match: '4dx', text: 'Motion seats that tilt and move in sync with on-screen action, plus environmental effects like wind, mist, and scent.' },
    { match: 'lg led', text: "A premium screen using LG's direct-view LED display instead of a projector -- brighter image and deeper blacks, without needing a dark projection booth." },
    // Two spelling variants seen in real use -- "D-BOX" (hyphen becomes
    // a space after normalization) and the unhyphenated "DBOX".
    { match: 'd box', text: 'Motion seating that moves in sync with the on-screen action -- similar in spirit to 4DX, but without the added environmental effects like wind or scent.' },
    { match: 'dbox', text: 'Motion seating that moves in sync with the on-screen action -- similar in spirit to 4DX, but without the added environmental effects like wind or scent.' },
    { match: 'luxury lounger', text: 'Extra-wide, plush reclining lounge seating -- a comfort upgrade on its own, distinct from D-BOX\'s motorized motion seating (though some auditoriums combine both).' },
    { match: 'screenx', text: 'A 270° panoramic format that extends the image onto the left and right walls of the auditorium -- no glasses required. Available only at select Regal locations.' },
  ];

  function getFormatDescription(format) {
    const normalized = (format || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
    if (!normalized) return null;

    const matched = [];
    const seenText = new Set(); // avoid double-counting "d box" and "dbox" both hitting the same badge
    for (const { match, text } of FORMAT_DESCRIPTIONS) {
      if (normalized.includes(match) && !seenText.has(text)) {
        matched.push(text);
        seenText.add(text);
      }
    }
    return matched.length ? matched.join('\n\n') : null;
  }

  function runCurrentModeSearch() {
    if (searchMode === 'imax70') { imax70Data = null; return loadImax70(); }   // fresh date/location -> fresh data
    return searchMode === 'window' ? runWindowSearch() : runSearch();
  }

  // ---- IMAX 70mm tab ---------------------------------------------------
  // One question: what 15/70 screens are near me, and what is actually playing
  // on them today. Ignores the search radius on purpose -- someone asking will
  // drive further than for an ordinary showing.
  let imax70Origin = null;   // remembered so follow-up lookups don't re-geocode
  let imax70Data = null;     // last full response, so follow-ups can merge into it
  async function loadImax70(opts) {
    const { maxMiles, venues, priceVenue, listOnly } = (typeof opts === 'string' ? { maxMiles: opts } : (opts || {}));
    // A follow-up asks about SOME venues; the response marks every other venue
    // notRequested. Replacing the view with that would throw away everything
    // already on screen to price a single row, so follow-ups merge instead --
    // and only a first load gets the "looking up" wipe.
    const isFollowUp = !!(venues || priceVenue) && !!imax70Data;
    if (!isFollowUp) {
      els.imax70Body.innerHTML = '<div style="font-size:12px; color:var(--ink-dim);">Looking up IMAX 70mm venues&hellip;</div>';
    }
    els.searchBtn.disabled = true;
    try {
      let lat = els.lat.value, lng = els.lng.value;
      if (!lat || !lng) {
        const place = els.place.value.trim();
        if (!place) { els.imax70Body.innerHTML = '<div class="banner error">Enter a location first.</div>'; return; }
        const geo = await fetch(`/api/geocode?place=${encodeURIComponent(place)}`).then((r) => r.json());
        if (!geo || geo.lat == null) throw new Error(geo && geo.error ? geo.error : `couldn't find "${place}"`);
        lat = geo.lat; lng = geo.lng;
      }
      imax70Origin = { lat, lng };
      const params = new URLSearchParams({ lat, lng, only70mm: 'true' });
      if (maxMiles) params.set('maxMiles', maxMiles);
      // listOnly=0 miles: return every venue with distances but look nothing
      // up. Lets "show me the rest" cost nothing.
      if (listOnly) params.set('maxMiles', '0');
      if (venues) params.set('venues', venues);
      if (priceVenue) params.set('priceVenue', priceVenue);
      if (els.searchDate && els.searchDate.value) params.set('date', els.searchDate.value);
      const data = await fetch(`/api/imax-70mm?${params}`).then((r) => r.json());
      if (data.error) throw new Error(data.error);
      if (isFollowUp) {
        // Take only the venues this call actually looked at. A venue that came
        // back notRequested carries no new information and must not clobber
        // what we already know about it.
        const fresh = new Map((data.venues || []).filter((v) => v.checked || v.error).map((v) => [v.name, v]));
        imax70Data.venues = imax70Data.venues.map((v) => (fresh.has(v.name) ? { ...v, ...fresh.get(v.name) } : v));
        imax70Data.films = { ...(imax70Data.films || {}), ...(data.films || {}) };
      } else {
        imax70Data = data;
      }
      renderImax70(imax70Data);
    } catch (err) {
      els.imax70Body.innerHTML = `<div class="banner error">Couldn't look that up: ${escapeHtml(err.message)}</div>`;
    } finally {
      els.searchBtn.disabled = false;
    }
  }

  function renderImax70(data) {
    const venues = data.venues || [];
    const playing = venues.filter((v) => v.showings && v.showings.length);
    const fmtDist = (m) => (m > 180 ? `${Math.round(m / 60)}h drive` : `${m} min`);

    const row = (v) => {
      const times = (v.showings || []).slice(0, 10).map((sh) => {
        const t = escapeHtml(String(sh.time || '').slice(0, 5));
        const price = sh.price != null ? ` <span class="imax70-price">$${sh.price.toFixed(2)}</span>` : '';
        // Marked when the source didn't actually say 70mm -- a single-screen
        // house has nothing to disambiguate, so it is a strong inference, not
        // a statement. The tooltip carries the distinction.
        const star = sh.confirmed === false
          ? `<span title="This venue has a single IMAX screen, so the showing is almost certainly the film print -- but the source doesn't say 70mm outright.">*</span>`
          : '';
        const label = `${t}${star}${price}`;
        return sh.buyUrl
          ? `<a href="${escapeHtml(sh.buyUrl)}" target="_blank" rel="noopener" class="imax70-buy">${label}</a>`
          : label;
      }).join(' &middot; ');
      const filmNames = [...new Set((v.showings || []).map((sh) => sh.movieName).filter(Boolean))];
      // Same details the free-time search puts on a card: poster, year,
      // runtime, scores. Shown once per venue rather than once per showtime,
      // because a 70mm run is usually one film with several times.
      const filmBlock = filmNames.map((n) => {
        const f = (data.films || {})[n] || {};
        const meta = [f.year, f.runtimeMinutes ? fmtRuntime(f.runtimeMinutes) : null].filter(Boolean).join(' \u00b7 ');
        return `<div class="imax70-film">
            ${f.poster ? `<img class="imax70-poster" src="${escapeHtml(f.poster)}" alt="${escapeHtml(n)} poster" loading="lazy" onerror="this.remove()">` : ''}
            <div>
              <div class="imax70-film-title">${escapeHtml(n)}</div>
              ${meta ? `<div class="imax70-film-meta">${escapeHtml(meta)}</div>` : ''}
              ${f.ratings ? ratingsHtml(f.ratings) : ''}
            </div>
          </div>`;
      }).join('');
      return `<div class="imax70-row">
          <div class="imax70-row-dist">${fmtDist(v.distanceMin)}</div>
          <div>
            <div><b>${escapeHtml(v.name)}</b> &middot; ${escapeHtml(v.city)}, ${escapeHtml(v.state)}</div>
            ${filmBlock}
            ${times ? `<div class="imax70-row-times">${times}</div>` : ''}
            ${v.seating ? `<div class="imax70-row-seats" title="${escapeHtml(v.seating.note || '')}">sit in row ${escapeHtml(v.seating.best)}</div>` : ''}
            ${(v.showings && v.showings.length && v.showings.every((sh) => sh.price == null) && v.chain === 'regal')
              ? `<button class="locate-btn imax70-price-btn" data-venue="${escapeHtml(v.name)}" style="margin-top:5px; font-size:11px;">Price these showings</button>`
              : ''}
            ${v.priceError ? `<div class="imax70-row-times" style="color:var(--error);">pricing failed: ${escapeHtml(v.priceError)}</div>` : ''}
          </div>
        </div>`;
    };

    const checked = venues.filter((v) => v.checked).length;
    // Three distinct outcomes, deliberately not collapsed into one "no
    // showings" bucket: a venue we checked and found nothing at is a real
    // answer, a venue we couldn't reach is not an answer at all, and one we
    // didn't try is a choice the user can undo. Rendering them the same way
    // made a rate-limited lookup indistinguishable from a quiet Tuesday.
    const failed = venues.filter((v) => v.error && !(v.showings && v.showings.length));
    // Everything we deliberately didn't look up -- too far, or not among the
    // venues the user picked. Listed for free, with a way to opt in.
    const notLookedUp = venues.filter((v) => v.tooFar || v.notRequested);
    const rest = venues
      .filter((v) => !(v.showings && v.showings.length) && !v.error && !v.tooFar)
      .slice(0, 6);
    els.imax70Body.innerHTML =
      (playing.length
        ? `<div class="status-line"><b>${playing.length}</b> venue${playing.length === 1 ? '' : 's'} with an IMAX 70mm showing today, nearest first.</div>` + playing.map(row).join('')
        : `<div class="status-line">No IMAX 70mm showings found today at the ${checked} venue${checked === 1 ? '' : 's'} we can check.</div>`) +
      (rest.length
        ? `<div class="status-line" style="margin-top:14px;">Checked, nothing on IMAX 70mm today:</div>` + rest.map(row).join('')
        : '') +
      (failed.length
        ? `<div class="status-line" style="margin-top:14px;">Couldn't check ${failed.length} venue${failed.length === 1 ? '' : 's'}` +
          `${failed.some((v) => v.retryable) ? ' &mdash; rate limited, worth retrying' : ''}:</div>` +
          failed.map((v) => `<div class="imax70-row">
              <div class="imax70-row-dist">${fmtDist(v.distanceMin)}</div>
              <div>
                <div><b>${escapeHtml(v.name)}</b> &middot; ${escapeHtml(v.city)}, ${escapeHtml(v.state)}</div>
                <div class="imax70-row-times" style="color:var(--warn);">${escapeHtml(v.error)}${v.retryable ? ' (temporary)' : ''}</div>
              </div>
            </div>`).join('')
        : '') +
      // Only offered when something was actually skipped, and it says how many
      // -- a bare "search further" button gives no sense of whether it is worth
      // the wait, and each of those venues costs a real lookup.
      // Two separate offers, because they cost very different things. Listing
      // the far venues is free; looking them up is a request apiece.
      (notLookedUp.length
        ? `<div class="status-line" style="margin-top:14px;">Other 15/70 screens (not checked for showtimes):</div>` +
          notLookedUp.map((v) => `<div class="imax70-row">
              <div class="imax70-row-dist">${fmtDist(v.distanceMin)}</div>
              <div>
                <div><label style="cursor:pointer;"><input type="checkbox" class="imax70-pick" value="${escapeHtml(v.name)}" style="margin-right:6px;">` +
                `<b>${escapeHtml(v.name)}</b> &middot; ${escapeHtml(v.city)}, ${escapeHtml(v.state)}</label></div>
                ${v.seating ? `<div class="imax70-row-seats" title="${escapeHtml(v.seating.note || '')}">sit in row ${escapeHtml(v.seating.best)}</div>` : ''}
              </div>
            </div>`).join('') +
          `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">` +
            `<button class="locate-btn" id="imax70CheckPicked" type="button">Check selected</button>` +
            `<button class="locate-btn" id="imax70CheckAll" type="button">Check all ${notLookedUp.length}</button>` +
          `</div>`
        : '') +
      `<div class="imax70-foot">True 15/70 film projection &mdash; not the digital IMAX in the format filter.</div>`;

    const pick = () => [...document.querySelectorAll('.imax70-pick:checked')].map((c) => c.value);
    const byId = (id) => document.getElementById(id);
    const busy = (btn, label) => { if (btn) { btn.disabled = true; btn.textContent = label; } };
    if (byId('imax70CheckPicked')) byId('imax70CheckPicked').addEventListener('click', () => {
      const chosen = pick();
      if (!chosen.length) return;
      busy(byId('imax70CheckPicked'), 'Checking\u2026');
      loadImax70({ venues: chosen.join(',') });
    });
    if (byId('imax70CheckAll')) byId('imax70CheckAll').addEventListener('click', () => {
      busy(byId('imax70CheckAll'), 'Checking\u2026');
      loadImax70({ maxMiles: 'all' });
    });
    document.querySelectorAll('.imax70-price-btn').forEach((b) => b.addEventListener('click', () => {
      busy(b, 'Pricing\u2026');
      loadImax70({ venues: b.dataset.venue, priceVenue: b.dataset.venue });
    }));
  }

  els.searchBtn.addEventListener('click', runCurrentModeSearch);
  [els.movie, els.place, els.availableFrom, els.availableForHours].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') runCurrentModeSearch(); });
  });
</script>
</body>
</html>
