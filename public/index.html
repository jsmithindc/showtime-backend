<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Showtime Finder</title>
<style>
  :root {
    --ink: #f4efe6;
    --ink-dim: #b8ada0;
    --marquee: #14121a;
    --marquee-2: #1d1a24;
    --marquee-3: #252030;
    --gold: #e2a545;
    --gold-dim: #8a6a34;
    --stub-line: #3a3444;
    --stubs-bg: rgba(80,180,100,0.08);
    --stubs-label: #6aab78;
    --stubs-amt: #7dd68a;
    --best: #7fa66b;
    --warn: #c98a3d;
    --error: #c96a5a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--marquee);
    color: var(--ink);
    margin: 0;
    padding: 28px 18px 64px;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 30px;
    color: var(--gold);
    margin: 0 0 2px;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 13px;
    margin: 0 0 22px;
  }

  .panel {
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 22px;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 14px;
  }

  .field { flex: 1 1 160px; min-width: 130px; }
  .field.wide { flex-basis: 260px; }
  /* min-width: 0 overrides the flex default (min-width: auto), which
     otherwise lets a child's intrinsic content size win over its own
     width: 100% -- iOS Safari's native time-input wheel has exactly that
     kind of intrinsic minimum, and without this it pushes the field
     wider than the row/card around it instead of shrinking to fit. */
  .field.field-time { min-width: 0; }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="number"],
  input[type="time"] {
    width: 100%;
    max-width: 100%;
    background: var(--marquee);
    border: 1px solid var(--stub-line);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }

  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* iOS Safari/WebKit (which Brave, Chrome, etc. all run on under Apple's
     rules) doesn't fully honor box-sizing: border-box on the native
     time-input control -- its own picker chrome pads out past the
     declared box instead of being contained inside it, so the rendered
     control ends up wider than the card around it. Stripping the native
     appearance hands sizing back to normal CSS box-model rules; the
     control still opens the native wheel picker on tap since it's still
     type="time", only its skin changes. */
  input[type="time"] {
    -webkit-appearance: none;
    appearance: none;
  }

  .coord-row { display: flex; gap: 8px; align-items: flex-end; }
  .coord-row .field { flex: 1; }

  .locate-btn {
    background: var(--marquee-3);
    border: 1px solid var(--stub-line);
    color: var(--gold);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .locate-btn:hover { border-color: var(--gold-dim); }
  .locate-btn:disabled { opacity: 0.5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }

  .filter-section { margin-bottom: 8px; }
  .filter-section summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    list-style: none;
    user-select: none;
    font-size: 14px;
    color: var(--ink-dim);
    padding: 4px 0;
  }
  .filter-section summary::-webkit-details-marker { display: none; }
  .filter-section summary .filter-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-section summary .filter-chevron {
    font-size: 10px;
    transition: transform 0.15s;
    color: var(--ink-dim);
  }
  .filter-section[open] summary .filter-chevron { transform: rotate(90deg); }
  .filter-section summary .filter-status {
    font-size: 11px;
    color: var(--ink-dim);
  }
  .filter-section .filter-body { padding: 6px 0 4px; }

  .chip {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--stub-line);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .chip.on {
    border-color: var(--gold);
    color: var(--marquee);
    background: var(--gold);
    font-weight: 600;
  }

  /* Deliberately NOT reusing .chip here. The format/chain filters are
     independent pill toggles (any subset can be on), so their rounded,
     individually-bordered look correctly signals "pick any of these."
     Sort mode is a mutually-exclusive EITHER/OR choice -- exactly one
     is always active -- so it gets a segmented-control look instead:
     one shared rectangular border, a divider between the two options,
     sharp corners instead of full pills, and a neutral dark fill
     instead of gold (gold is used elsewhere for price/selection
     emphasis; reusing it here would visually imply this is another
     filter chip row rather than a different kind of control). */
  .sort-toggle {
    display: inline-flex;
    border: 1px solid var(--stub-line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .sort-toggle button {
    font-size: 12.5px;
    padding: 6px 14px;
    border: none;
    border-right: 1px solid var(--stub-line);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .sort-toggle button:last-child { border-right: none; }
  .sort-toggle button.on {
    background: var(--ink-dim);
    color: #fff;
    font-weight: 600;
  }

  .search-btn {
    width: 100%;
    background: var(--gold);
    color: var(--marquee);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .search-btn:hover { background: #eeb75c; }
  .search-btn:disabled { opacity: 0.6; cursor: default; }

  .status-line {
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 14px;
    min-height: 18px;
  }
  .status-line b { color: var(--gold); }

  .banner {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .banner.warn { background: rgba(201, 138, 61, 0.12); border: 1px solid var(--warn); color: var(--warn); }
  .banner.error { background: rgba(201, 106, 90, 0.12); border: 1px solid var(--error); color: var(--error); }
  .overflow-banner {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 10px;
    padding: 8px 12px;
    border: 1px solid var(--stub-line);
    border-radius: 8px;
  }
  .overflow-reveal-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }

  .empty {
    border: 1px dashed var(--stub-line);
    border-radius: 10px;
    padding: 30px 18px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 14px;
  }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    display: flex;
    align-items: stretch;
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card.best { border-color: var(--best); }

  .price-col {
    width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px dashed var(--stub-line);
    padding: 12px 8px;
    text-align: center;
  }
  .price {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--gold);
  }
  .price.unknown {
    font-size: 12px;
    color: var(--ink-dim);
    font-weight: 400;
  }
  .price-breakdown {
    font-size: 10.5px;
    color: var(--ink-dim);
    font-weight: 400;
    margin-top: 2px;
    line-height: 1.3;
  }
  .stubs-stub {
    margin-top: 8px;
    padding: 6px 8px;
    background: var(--stubs-bg);
    border-radius: 5px;
    min-width: 0;
  }
  .stubs-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--stubs-label);
    margin-bottom: 4px;
  }
  .stubs-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    line-height: 1.5;
  }
  .stubs-venue {
    font-size: 11px;
    color: var(--ink-dim);
  }
  .stubs-amt {
    font-size: 12px;
    font-weight: 600;
    color: var(--stubs-amt);
    white-space: nowrap;
  }
  .stubs-amt-solo {
    font-size: 15px;
  }
  .stubs-note {
    font-size: 10px;
    color: var(--ink-dim);
    margin-top: 3px;
    line-height: 1.3;
  }
  .best-tag {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--best);
    font-weight: 700;
    margin-top: 4px;
  }

  .card-body { flex: 1; padding: 12px 16px; min-width: 0; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .theater-name { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Window-search shows titles and times but no prices -- pricing every film
     playing tonight would mean a cart per showing. This hands the film to the
     movie search, which does price it, without retyping anything. */
  .price-this {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--marquee);
    background: var(--gold);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .price-this:hover { filter: brightness(1.08); }
  .price-this:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Search status, not a filter. Sits directly above the format/chain chips,
     which are also small dim rows -- without a distinct surface the two read
     as one undifferentiated block of controls. */
  .chain-report {
    margin: 12px 0 4px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink-dim);
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 8px;
  }
  .chain-report > summary {
    cursor: pointer;
    font-weight: 600;
    letter-spacing: .02em;
    list-style: revert;
  }
  .chain-report[data-failed] > summary { color: var(--error); }
  .chain-report-rows {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--stub-line);
    font-family: ui-monospace, Menlo, monospace;
    line-height: 1.55;
  }

  /* The poster is its own full-height column rather than sitting inside the
     card head. Beside the title alone it left a band of dead space to its
     right, since a 2:3 poster is far taller than a title plus a ratings row --
     as a column it runs the height of the card and the text uses the width. */
  .poster-col {
    flex: none;
    display: flex;
    align-items: center;
    padding: 12px 0 12px 14px;
  }

  .poster {
    display: block;
    flex: none;
    border-radius: 4px;
    background: var(--marquee-3);
    object-fit: cover;
  }
  /* Sized to actually read as artwork rather than a favicon. At 46px a poster
     was decoration; at 76px the title and faces are legible while scanning. */
  .poster-thumb { width: 76px; aspect-ratio: 2 / 3; }
  /* Movie mode shows ONE film for the whole search, so its poster carries the
     header and can be larger still. */
  .poster-hero { width: 132px; aspect-ratio: 2 / 3; }

  /* Movie mode header, laid out like a title page: name, then year/runtime,
     then the artwork at a size worth looking at, then scores, then the count.
     Replaces the old side-by-side summary-head, where a 132px poster next to a
     single row of scores left the artwork reading as an icon. */
  .film-hero { margin: 0 0 18px; }
  .film-hero-title {
    font-size: clamp(28px, 5.5vw, 44px);
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .film-hero-meta { font-size: 15px; color: var(--ink-dim); margin: 0 0 14px; }
  /* Overrides .poster-hero's card-sized width -- here it is the header. */
  .film-hero .poster-hero { width: min(260px, 64%); height: auto; border-radius: 10px; display: block; margin: 0 0 12px; }
  .film-hero .ratings { margin: 0 0 10px; }
  .film-hero-count { font-size: 13px; color: var(--ink-dim); }
  .film-hero-count b { color: var(--gold); }

  /* Narrow screens: keep the poster meaningful but give the text room. */
  @media (max-width: 480px) {
    .poster-thumb { width: 60px; }
    .poster-hero { width: 104px; }
    .film-hero .poster-hero { width: min(240px, 80%); }
  }

  .ratings { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 6px; }
  .rating {
    font-size: 12px;
    color: var(--ink-dim);
    white-space: nowrap;
    cursor: help;
  }

  /* Window-search cards answer "what can I watch"
, so the FILM is the subject
     and the theater is context. Both used to render at font-weight 600, one
     directly above the other, which made an unfamiliar film and an unfamiliar
     theater indistinguishable. The film now leads the card; the theater drops
     to a lighter, dimmer supporting line. */
  .movie-name {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .movie-name .runtime { font-weight: 400; color: var(--ink-dim); font-size: 12px; }
  .card.window-mode .theater-name {
    font-weight: 400;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .card.window-mode .theater-name::before { content: "at "; opacity: .7; }
  .dist { font-size: 12px; color: var(--ink-dim); white-space: nowrap; flex-shrink: 0; }
  /* Past the requested radius but inside the 5-minute buffer. Tinted and
     labelled rather than hidden -- the point is that the user can see it and
     judge for themselves, not that it looks like every other result. */
  .dist-over { color: var(--warn); font-weight: 600; cursor: help; }

  /* Nearest 15/70 film venue. Understated -- it is context, not a result. */
  .imax70 {
    margin: 10px 0 4px;
    padding: 7px 11px;
    font-size: 12px;
    color: var(--ink-dim);
    background: var(--marquee-2);
    border: 1px solid var(--stub-line);
    border-radius: 8px;
    cursor: help;
  }
  .imax70 b { color: var(--ink); }
  /* Promoted: a 70mm print is actually playing, which is the rare case this
     whole feature exists for. */
  .imax70-live { border-color: var(--gold); background: rgba(226,165,69,0.10); }
  .mode-aside { margin-left: auto; }
  .imax70-row { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--stub-line); font-size: 12px; }
  .imax70-row:first-of-type { border-top: 0; }
  .imax70-row-dist { flex: 0 0 74px; color: var(--gold); font-weight: 700; }
  .imax70-row b { color: var(--ink); }
  .imax70-row-times { margin-top: 2px; font-size: 11px; color: var(--ink-dim); }
  .imax70-row-seats { margin-top: 2px; font-size: 11px; color: var(--best); cursor: help; }
  .imax70-film { display: flex; gap: 9px; align-items: flex-start; margin: 5px 0 4px; }
  .imax70-poster { width: 42px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; background: var(--marquee-3); flex: none; }
  .imax70-film-title { font-weight: 700; color: var(--ink); font-size: 12px; }
  .imax70-film-meta { font-size: 11px; color: var(--ink-dim); margin-top: 1px; }
  .imax70-film .ratings { margin: 3px 0 0; }
  .imax70-price { color: var(--stubs-amt); font-weight: 700; }
  .imax70-buy { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--stub-line); }
  .imax70-buy:hover { color: var(--gold); }
  .imax70-foot { margin-top: 8px; font-size: 10px; color: var(--ink-dim); opacity: .75; }
  .imax70-seats { margin-top: 5px; font-size: 11px; color: var(--ink-dim); opacity: .95; }
  .imax70-seats b { color: var(--gold); }
  .imax70-tag {
    display: inline-block;
    margin-right: 7px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--gold-dim);
    color: #12100e;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  #timingBar {
    /* NOT display:none here -- renderTiming() reveals this by setting
       style.display = '', which only overrides an INLINE none. Putting the
       hide in the stylesheet made the bar permanently invisible. */
    margin: 22px 0 4px;
    padding-top: 10px;
    border-top: 1px solid var(--stub-line);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--ink-dim);
    opacity: 0.65;
    text-align: right;
  }

  /* Completion flourish. notifySearchComplete only fires an OS notification
     when the tab is HIDDEN, so someone actually watching the page got no
     signal that the last chain had reported -- on a 30s+ search that is the
     one moment worth marking. Fades itself out rather than leaving another
     permanent badge on screen. */
  .search-done {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 9px;
    font-size: 12px;
    font-weight: 700;
    color: var(--best);
    animation: doneIn 0.32s cubic-bezier(.2,.9,.3,1.4), doneOut 0.8s ease-in 3.6s forwards;
  }
  .search-done::before { content: "\2713"; font-size: 13px; }
  @keyframes doneIn  { from { opacity: 0; transform: translateY(-5px) scale(0.94); } to { opacity: 1; transform: none; } }
  @keyframes doneOut { to { opacity: 0; } }

  /* One soft sweep across the results so the eye catches that it settled. */
  .results-settled { animation: settle 1.1s ease-out; }
  @keyframes settle {
    0%   { background: rgba(127,166,107,0.13); }
    100% { background: transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    .search-done { animation: doneOut 0.8s ease-in 3.6s forwards; }
    .results-settled { animation: none; }
  }
  /* Learned estimate, not a real price: same size so the layout doesn't jump,
     but dimmed and italic so it never reads as something the chain quoted. */
  .price.estimated { color: var(--warn); font-style: italic; cursor: help; }
  .estimated-note { color: var(--warn); opacity: 0.8; font-style: italic; cursor: help; }

  .meta {
    margin-top: 6px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .format-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 2px 7px;
  }
  .time { color: var(--ink); font-weight: 500; }
  /* Matches .price's visual weight (same font/size/weight) so the
     showtime reads as equally important as the price at a glance --
     ink-colored rather than gold to keep price as the one gold "hero"
     number on the card, per the ticket-stub design language. */
  .time-large {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-top: 6px;
  }
  .time-sub {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .card-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gold-dim);
    text-decoration: none;
  }
  .card-link:hover { color: var(--gold); text-decoration: underline; }

  .price-source {
    font-size: 10.5px;
    color: var(--ink-dim);
    margin-top: 3px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.15s ease; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Showtime Finder <span id="versionBadge" style="font-size:12px; font-weight:400; color:#888; vertical-align:middle;" title="deployed version"></span></h1>
  <p class="subtitle">Cheapest ticket, any format, that still gets you out on time.</p>

  <div class="panel">
    <div class="row" style="margin-bottom:12px;">
      <button class="chip on" id="modeMovieBtn" type="button">Search a specific movie</button>
      <button class="chip" id="modeWindowBtn" type="button">What fits my free time?</button>
      <!-- Right-aligned to signal it is a different KIND of thing: the other
           two are modes of the same search (same inputs, priced showtime cards
           out); this is a location lookup that ignores the radius. -->
      <button class="chip mode-aside" id="modeImaxBtn" type="button">IMAX 70mm near me</button>
    </div>

    <div id="specificMovieFields">
      <div class="row">
        <div class="field wide" style="flex-basis:100%;">
          <label for="movie">Movie</label>
          <div style="display:flex; gap:8px;">
            <select id="movie" style="flex:1; min-width:0;">
              <option value="" disabled selected>Loading what's in theaters...</option>
            </select>
            <button class="locate-btn" id="loadMoviesBtn" type="button" style="flex-shrink:0; opacity:0.6; font-size:12px; padding:6px 10px;" title="Look up movies playing specifically at theaters near you -- for anything not in the list already, like a local/independent theater">Not seeing it?</button>
          </div>
          <input type="text" id="movieFreeText" placeholder="Not in the list? Type a title here..." style="display:none; margin-top:6px; width:100%; box-sizing:border-box;" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <div class="field field-time">
          <label for="deadline">Must end by</label>
          <input type="time" id="deadline" value="22:00" />
        </div>
      </div>
    </div>

    <div class="row" id="windowFields" style="display:none;">
      <div class="field field-time">
        <label for="availableFrom">Free from</label>
        <input type="time" id="availableFrom" />
      </div>
      <div class="field">
        <label for="availableForHours">For how long (hours)</label>
        <input type="number" id="availableForHours" value="3" min="0.5" step="0.5" />
      </div>
    </div>

    <div class="row" id="dateRadiusFields">
      <div class="field">
        <label for="searchDate">Date</label>
        <input type="date" id="searchDate" />
      </div>
      <!-- Its own id so the IMAX 70mm tab can hide the radius while keeping the
           date: that lookup deliberately ignores distance, but "what's on
           70mm on Friday" is a real question. -->
      <div class="field" id="radiusField">
        <label for="radius">Within (minutes)</label>
        <input type="number" id="radius" value="15" min="1" />
      </div>
    </div>

    <div class="row">
      <div class="field wide">
        <label for="place">Location</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="place" placeholder="Zip code or city, e.g. 92835 or Fullerton, CA" style="flex:1;" />
          <button class="locate-btn" id="locateBtn" type="button">Use my location</button>
        </div>
      </div>
    </div>
    <!-- Set directly by "Use my location" (bypasses geocoding); left
         empty otherwise, in which case the place text above is geocoded
         server-side. -->
    <input type="hidden" id="lat" />
    <input type="hidden" id="lng" />

    <details class="filter-section" id="formatSection">
      <summary>
        <span class="filter-label">
          <span class="filter-chevron">▶</span>
          Formats
        </span>
        <span class="filter-status" id="formatSectionStatus">All</span>
      </summary>
      <div class="filter-body">
        <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
          <span id="formatChipsToggle" style="font-size:11px; color:var(--ink-dim); cursor:pointer; user-select:none;">none</span>
        </div>
        <div class="chips" id="formatChips">
          <button class="chip on" data-format="standard">Standard</button>
          <button class="chip on" data-format="3d">3D</button>
          <button class="chip on" data-format="imax">IMAX</button>
          <button class="chip on" data-format="dolby cinema">Dolby Cinema</button>
          <button class="chip on" data-format="px rpx">RPX</button>
          <button class="chip on" data-format="4dx">4DX</button>
          <button class="chip on" data-format="screenx">ScreenX</button>
          <button class="chip on" data-format="lg led">LG LED</button>
        </div>
      </div>
    </details>

    <details class="filter-section" id="chainSection">
      <summary>
        <span class="filter-label">
          <span class="filter-chevron">▶</span>
          Chains
        </span>
        <span class="filter-status" id="chainSectionStatus">All</span>
      </summary>
      <div class="filter-body">
        <div style="display:flex; justify-content:flex-end; margin-bottom:4px;">
          <span id="chainChipsToggle" style="font-size:11px; color:var(--ink-dim); cursor:pointer; user-select:none;">none</span>
        </div>
        <div class="chips" id="chainChips">
          <button class="chip on" data-chain="amc">AMC</button>
          <button class="chip on" data-chain="regal">Regal</button>
          <button class="chip on" data-chain="cinemark">Cinemark</button>
          <button class="chip on" data-chain="cinemawest">Cinema West</button>
          <button class="chip on" data-chain="harkins">Harkins</button>
          <button class="chip on" data-chain="regency">Regency</button>
          <button class="chip on" data-chain="alamo">Alamo</button>
          <button class="chip on" data-chain="marcus">Marcus</button>
          <button class="chip on" data-chain="landmark">Landmark</button>
        </div>
      </div>
    </details>

    <!-- Results for the IMAX 70mm tab render here. -->
    <div id="imax70Body" style="display:none;"></div>

    <button class="search-btn" id="searchBtn" type="button">Find showtimes</button>
  </div>

  <div class="status-line" id="statusLine"></div>
  <div id="banners"></div>
  <div id="results"></div>
  <!-- Reference material, not headlines: the chain report and (usually) the
       70mm venue note live here with the timings. Useful to whoever runs this,
       uninteresting to someone who just wants a showtime. -->
  <div id="pageFooter"></div>
  <div id="timingBar" style="display:none;"></div>
</div>

<script>
  const els = {
    modeMovieBtn: document.getElementById('modeMovieBtn'),
    modeWindowBtn: document.getElementById('modeWindowBtn'),
    specificMovieFields: document.getElementById('specificMovieFields'),
    windowFields: document.getElementById('windowFields'),
    dateRadiusFields: document.getElementById('dateRadiusFields'),
    radiusField: document.getElementById('radiusField'),
    modeImaxBtn: document.getElementById('modeImaxBtn'),
    formatSection: document.getElementById('formatSection'),
    chainSection: document.getElementById('chainSection'),
    availableFrom: document.getElementById('availableFrom'),
    availableForHours: document.getElementById('availableForHours'),
    movie: document.getElementById('movie'),
    searchDate: document.getElementById('searchDate'),
    radius: document.getElementById('radius'),
    deadline: document.getElementById('deadline'),
    lat: document.getElementById('lat'),
    lng: document.getElementById('lng'),
    place: document.getElementById('place'),
    locateBtn: document.getElementById('locateBtn'),
    loadMoviesBtn: document.getElementById('loadMoviesBtn'),
    movieFreeText: document.getElementById('movieFreeText'),
    searchBtn: document.getElementById('searchBtn'),
    statusLine: document.getElementById('statusLine'),
    pageFooter: document.getElementById('pageFooter'),
    imax70Body: document.getElementById('imax70Body'),
    banners: document.getElementById('banners'),
    results: document.getElementById('results'),
  };

  let searchMode = 'movie'; // 'movie' | 'window'

  // Each mode keeps its own results, so switching back and forth doesn't throw
  // away a search you just waited 25 seconds for. Switching used to wipe the
  // pane outright, which also left the OTHER mode's elapsed-time bar sitting
  // above an empty result list as if it described a search in this mode.
  //
  // The filter state travels with the snapshot: restoring the markup alone
  // would leave the format/chain chips describing the mode you just left.
  const modeSnapshots = { movie: null, window: null };

  function captureModeSnapshot() {
    const timingBar = document.getElementById('timingBar');
    return {
      results: els.results.innerHTML,
      banners: els.banners.innerHTML,
      statusLine: els.statusLine.innerHTML,
      timingHtml: timingBar ? timingBar.innerHTML : '',
      timingShown: timingBar ? timingBar.style.display !== 'none' : false,
      renderData: lastRenderData,
      renderOpts: lastRenderOpts,
      activeFormats: new Set(activeResultFormats),
      seenFormats: new Set(seenResultFormats),
      activeChains: new Set(activeResultChains),
      seenChains: new Set(seenResultChains),
      activeMovies: new Set(activeResultMovies),
      seenMovies: new Set(seenResultMovies),
    };
  }

  function applyModeSnapshot(snap) {
    const timingBar = document.getElementById('timingBar');
    els.results.innerHTML = snap ? snap.results : '';
    els.banners.innerHTML = snap ? snap.banners : '';
    els.statusLine.innerHTML = snap ? snap.statusLine : '';
    if (timingBar) {
      timingBar.innerHTML = snap ? snap.timingHtml : '';
      // Hidden outright with no snapshot -- a mode you haven't searched in yet
      // has no elapsed time to report.
      timingBar.style.display = snap && snap.timingShown ? '' : 'none';
    }
    lastRenderData = snap ? snap.renderData : null;
    lastRenderOpts = snap ? snap.renderOpts : null;
    activeResultFormats = snap ? new Set(snap.activeFormats) : new Set();
    seenResultFormats   = snap ? new Set(snap.seenFormats)   : new Set();
    activeResultChains  = snap ? new Set(snap.activeChains)  : new Set();
    seenResultChains    = snap ? new Set(snap.seenChains)    : new Set();
    activeResultMovies  = snap ? new Set(snap.activeMovies)  : new Set();
    seenResultMovies    = snap ? new Set(snap.seenMovies)    : new Set();
  }

  function setMode(mode) {
    if (mode === searchMode) return;
    modeSnapshots[searchMode] = captureModeSnapshot();
    searchMode = mode;
    const isWindow = mode === 'window';
    const isImax = mode === 'imax70';
    els.modeMovieBtn.classList.toggle('on', mode === 'movie');
    els.modeWindowBtn.classList.toggle('on', isWindow);
    els.modeImaxBtn.classList.toggle('on', isImax);

    // The IMAX tab asks one question -- "what's near me" -- so everything
    // except the location is hidden. Date, radius, deadline and the format and
    // chain filters have no meaning here: the lookup deliberately ignores the
    // radius, and "IMAX 70mm" is the format.
    els.specificMovieFields.style.display = (isWindow || isImax) ? 'none' : '';
    els.windowFields.style.display = isWindow ? '' : 'none';
    // Date stays on the IMAX tab -- only the radius goes, since that lookup
    // ignores distance by design.
    els.dateRadiusFields.style.display = '';
    if (els.radiusField) els.radiusField.style.display = isImax ? 'none' : '';
    if (els.formatSection) els.formatSection.style.display = isImax ? 'none' : '';
    if (els.chainSection) els.chainSection.style.display = isImax ? 'none' : '';
    els.searchBtn.textContent = isImax ? 'Find IMAX 70mm' : isWindow ? 'Find what fits' : 'Find showtimes';

    // The IMAX tab owns its own output area; the shared result machinery is
    // for the two search modes.
    els.imax70Body.style.display = isImax ? '' : 'none';
    els.results.style.display = isImax ? 'none' : '';
    els.statusLine.style.display = isImax ? 'none' : '';
    if (els.pageFooter) els.pageFooter.style.display = isImax ? 'none' : '';
    if (!isImax) applyModeSnapshot(modeSnapshots[mode]);
  }
  els.modeMovieBtn.addEventListener('click', () => setMode('movie'));
  els.modeWindowBtn.addEventListener('click', () => setMode('window'));
  els.modeImaxBtn.addEventListener('click', () => setMode('imax70'));

  // "Price this film" on a window-search card. Window-search deliberately
  // doesn't price -- that would need a cart per showing for every film playing
  // tonight -- so this hands the film to the movie search, which does.
  //
  // Delegated from #results because cards are re-rendered on every filter
  // toggle and re-sort; per-button listeners would be lost each time.
  els.results.addEventListener('click', (e) => {
    const btn = e.target.closest('.price-this');
    if (!btn) return;
    const title = btn.dataset.movie;
    if (!title) return;

    // The movie <select> is populated from a discovery call that may not have
    // run, or may not list a film only playing at one chain. Add it rather
    // than silently failing to select it.
    if (![...els.movie.options].some((o) => o.value === title)) {
      const opt = document.createElement('option');
      opt.value = title;
      opt.textContent = title;
      els.movie.appendChild(opt);
    }
    els.movie.value = title;

    // The free-time window's END becomes the movie search's "must end by":
    // both express the same thing -- the film has to be over by then. Start
    // time doesn't carry over; the movie search always works forward from now.
    //
    // Taken from the rendered response rather than recomputed from the inputs.
    // There is no availableUntil field -- it's derived from "free from" plus a
    // duration -- and the inputs may have been edited since these results were
    // produced. lastRenderData.availableUntil is the window that actually
    // produced the card being clicked.
    const windowEnd = lastRenderData && lastRenderData.availableUntil;
    if (windowEnd) els.deadline.value = windowEnd;

    setMode('movie');
    runSearch();
  });

  // Restore last-used values so repeat searches don't require retyping
  // everything -- this is a personal local tool, not a shared page.
  const STORAGE_KEY = 'showtimeFinder.lastSearch';
  // The movie field is a real <select>, so a saved title can't be applied
  // directly until "Load nearby" actually populates matching <option>s.
  // Remember it here and re-apply it once that happens.
  let pendingMovieSelection = null;
  function loadSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (saved.movie) pendingMovieSelection = saved.movie;
      if (saved.radius) els.radius.value = saved.radius;
      if (saved.deadline) els.deadline.value = saved.deadline;
      // Guard against restoring a stale "Current location (...)" label
      // from an old session -- it's meaningless without the paired
      // lat/lng, which is deliberately never persisted.
      if (saved.place && !saved.place.startsWith('Current location')) {
        els.place.value = saved.place;
      }
    } catch {}
    // Date is deliberately NOT restored from localStorage -- always
    // default to today on load, rather than silently reusing whatever
    // date was last searched.
    //
    // CRITICAL: new Date().toISOString() is always UTC, not local time.
    // Confirmed as a real live bug: after ~5pm Pacific, UTC has already
    // rolled to the next calendar day, so this silently pre-filled the
    // date picker with TOMORROW's date before the user touched anything
    // -- then the server's (also-buggy, now fixed) deadline check saw a
    // future-dated search and filtered out every real showing as
    // "already started." Use local date components instead.
    const todayLocal = new Date();
    const todayISOLocal =
      `${todayLocal.getFullYear()}-${String(todayLocal.getMonth() + 1).padStart(2, '0')}-${String(todayLocal.getDate()).padStart(2, '0')}`;
    els.searchDate.value = todayISOLocal;
    // Same reasoning for "free from" -- always default to right now.
    const now = new Date();
    const roundedMinutes = Math.ceil(now.getMinutes() / 5) * 5;
    now.setMinutes(roundedMinutes, 0, 0);
    els.availableFrom.value = now.toTimeString().slice(0, 5);
  }
  function saveCurrent() {
    // Don't persist the geolocation placeholder text -- it's only
    // meaningful paired with the (never-persisted) lat/lng that produced
    // it, so saving it alone would just save a location that will fail
    // to geocode next time.
    const placeToSave = els.place.value.startsWith('Current location') ? '' : els.place.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      movie: els.movie.value,
      radius: els.radius.value,
      deadline: els.deadline.value,
      place: placeToSave,
    }));
  }
  loadSaved();


  // Pre-load a location-independent list of what's currently in wide
  // release, so picking a common movie doesn't require waiting on
  // "Not seeing it?" (which needs a location filled in first, and
  // costs a real SerpApi call per nearby theater) just to populate the
  // dropdown. Runs automatically on page load, no button press needed.
  (async () => {
    try {
      const res = await fetch('/api/popular-movies');
      const data = await res.json();
      if (res.ok && data.movies && data.movies.length) {
        els.movie.innerHTML = data.movies.map(movieOptionHtml).join('');
        if (pendingMovieSelection && data.movies.some((m) => movieTitleOf(m) === pendingMovieSelection)) {
          els.movie.value = pendingMovieSelection;
          pendingMovieSelection = null;
        }
      } else {
        els.movie.innerHTML = '<option value="" disabled selected>Fill in a location and press "Not seeing it?" to find movies</option>';
      }
    } catch {
      els.movie.innerHTML = '<option value="" disabled selected>Fill in a location and press "Not seeing it?" to find movies</option>';
    }
  })();

  // If the person edits the location text after using "Use my location",
  // the old coordinates are almost certainly stale -- clear them so the
  // next search geocodes the new text instead of silently using an old
  // GPS fix that no longer matches what's displayed.
  els.place.addEventListener('input', () => {
    els.lat.value = '';
    els.lng.value = '';
  });

  // Arrow keys step the whole date, not one segment of it.
  //
  // A native <input type="date"> increments each segment independently and
  // wraps it inside its own range, so pressing Up on the day part of Aug 31
  // gives Aug 1 rather than Sep 1. That's correct per spec but wrong for this
  // app, where the date is nearly always "today or one of the next few days"
  // and people reach for the arrows expecting a day stepper.
  //
  // Date arithmetic goes through local Y/M/D components, never toISOString(),
  // for the same reason the default value above does: toISOString() converts
  // to UTC and silently lands on the wrong day for anyone west of Greenwich
  // in the evening -- the exact bug called out in that comment.
  els.searchDate.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();

    const parts = (els.searchDate.value || '').split('-').map(Number);
    // Fall back to today if the field is empty or half-typed.
    const base = parts.length === 3 && parts.every((n) => !isNaN(n))
      ? new Date(parts[0], parts[1] - 1, parts[2])
      : new Date();

    base.setDate(base.getDate() + (e.key === 'ArrowUp' ? 1 : -1));

    // Floor at today -- showtimes for a past date are always empty, so
    // stepping down past it is never what someone means.
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (base < today) return;

    els.searchDate.value =
      `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
    // Let anything listening for a date change react as if it were typed.
    els.searchDate.dispatchEvent(new Event('change', { bubbles: true }));
  });

  els.locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      els.statusLine.textContent = "Geolocation isn't available in this browser -- enter a zip code or city instead.";
      return;
    }
    els.locateBtn.disabled = true;
    els.locateBtn.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        els.lat.value = pos.coords.latitude.toFixed(4);
        els.lng.value = pos.coords.longitude.toFixed(4);
        // Setting .value programmatically doesn't fire the 'input' event
        // listener that clears lat/lng, so this is safe.
        els.place.value = `Current location (${els.lat.value}, ${els.lng.value})`;
        els.locateBtn.disabled = false;
        els.locateBtn.textContent = 'Use my location';
      },
      (err) => {
        els.statusLine.textContent = `Couldn't get your location: ${err.message}. Enter a zip code or city instead.`;
        els.locateBtn.disabled = false;
        els.locateBtn.textContent = 'Use my location';
      }
    );
  });

  // The mode buttons reuse .chip for styling but behave like radio buttons, not
  // toggles -- setMode already owns their on/off state. This blanket handler is
  // registered AFTER the mode click handlers, so without the exclusion it ran
  // second and flipped the button setMode had just switched on, leaving both
  // modes looking unselected.
  document.querySelectorAll('.chip:not(#modeMovieBtn):not(#modeWindowBtn):not(#modeImaxBtn)').forEach((chip) => {
    chip.addEventListener('click', () => chip.classList.toggle('on'));
  });

  // Both movie endpoints return {title, runtimeMinutes}. Older deploys sent
  // plain strings, and this runs in a browser that may have cached the old
  // page against a new server (or the reverse), so accept either shape.
  // Compact score row. Each source is shown on its own native scale rather
  // than normalised to one number -- an IMDb 7.8/10 and an RT 91% mean
  // different things (user average vs share of positive reviews) and merging
  // them would invent a figure none of them reports.
  // Poster thumbnail. OMDb returns the URL on the lookup already being made for
  // ratings, so artwork costs no extra request.
  //
  // Fails quietly: a broken or blocked image hides itself rather than leaving a
  // torn-icon placeholder, since a missing poster shouldn't damage the card.
  function posterHtml(ratings, title, size = 'thumb') {
    const url = ratings && ratings.poster;
    if (!url) return '';
    return `<img class="poster poster-${size}" src="${escapeHtml(url)}" alt="${escapeHtml(title || '')} poster"
                 loading="lazy" onerror="this.remove()">`;
  }

  // Movie mode's title-page header. Split out from renderResults so it can be
  // painted the instant a search starts, from the form alone, rather than
  // waiting for the server -- the title and runtime are already known locally
  // (the dropdown carries both), and the poster and scores fill in when the
  // `ratings` event lands. Previously all of it waited for `done`, so on a
  // 52-second search the film's own artwork appeared 52 seconds in.
  //
  // Year comes from the ratings match, not the search date -- a re-release or
  // a late-December film would otherwise be labelled with the wrong one.
  function filmHeroHtml(data, { countLine }) {
    const metaBits = [];
    if (data.ratings && data.ratings.year) metaBits.push(escapeHtml(String(data.ratings.year)));
    if (data.runtimeMinutes) {
      metaBits.push(data.runtimeIsEstimate
        ? `<span title="No runtime data was available for this film, so end times and the deadline filter use a ${fmtRuntime(data.runtimeMinutes)} assumption. Actual end times may be later.">~${fmtRuntime(data.runtimeMinutes)}, estimated</span>`
        : fmtRuntime(data.runtimeMinutes));
    }
    return `<div class="film-hero">` +
      `<h2 class="film-hero-title">${escapeHtml(data.movie || '')}</h2>` +
      (metaBits.length ? `<div class="film-hero-meta">${metaBits.join(' &middot; ')}</div>` : '') +
      (data.ratings ? posterHtml(data.ratings, data.movie, 'hero') : '') +
      (data.ratings ? ratingsHtml(data.ratings) : '') +
      `<div class="film-hero-count">${countLine}</div>` +
    `</div>`;
  }

  function ratingsHtml(r) {
    if (!r) return '';
    const parts = [];
    if (r.rottenTomatoes != null) {
      const fresh = r.rottenTomatoes >= 60;
      const cf = r.rtCertifiedFresh ? ' Certified Fresh.' : '';
      parts.push(`<span class="rating" title="Tomatometer -- share of critics rating it positively.${cf}">${fresh ? '🍅' : '🫗'} ${r.rottenTomatoes}%</span>`);
    }
    // Audience score sits next to the critic score rather than replacing it --
    // they disagree often, and which one you trust is the reader's call.
    if (r.rtAudience != null) {
      const liked = r.rtAudience >= 60;
      const vh = r.rtVerifiedHot ? ' Verified Hot.' : '';
      parts.push(`<span class="rating" title="Popcornmeter -- share of verified audience ratings that are positive.${vh}">${liked ? '🍿' : '🥤'} ${r.rtAudience}%</span>`);
    }
    if (r.metacritic != null) {
      parts.push(`<span class="rating" title="Metacritic -- weighted average of critic scores, out of 100">Ⓜ ${r.metacritic}</span>`);
    }
    if (r.imdb != null) {
      // Attribution is a condition of using IMDb's Non-Commercial Datasets, so
      // it travels with the number itself rather than sitting in a page footer
      // the score could be seen without.
      const src = r.imdbIsExact
        ? 'Information courtesy of IMDb (imdb.com). Used with permission.'
        : 'Via OMDb, which mirrors IMDb periodically -- may lag the live score slightly.';
      parts.push(`<span class="rating" title="IMDb -- average user rating, out of 10. ${src}">★ ${r.imdb}</span>`);
    }
    if (!parts.length) return '';
    return `<div class="ratings">${parts.join('')}</div>`;
  }

  function movieTitleOf(m) { return typeof m === 'string' ? m : (m && m.title) || ''; }
  function movieOptionHtml(m) {
    const title = movieTitleOf(m);
    const mins = typeof m === 'object' && m ? m.runtimeMinutes : null;
    // Runtime lives in the visible label only -- the option VALUE stays the
    // bare title, because it's sent to the backend as the movie to search for.
    const label = mins ? `${title} (${fmtRuntime(mins)})` : title;
    // data-runtime as well as the label: the header painted at search start
    // reads the number from here rather than re-parsing "(2h 25m)" back out
    // of display text.
    return `<option value="${escapeHtml(title)}"${mins ? ` data-runtime="${mins}"` : ''}>${escapeHtml(label)}</option>`;
  }

  function setupChipGroupToggle(toggleEl, chipsEl, sectionEl, statusEl) {
    function updateLabel() {
      const chips = [...chipsEl.querySelectorAll('.chip')];
      const onCount = chips.filter((c) => c.classList.contains('on')).length;
      const allOn = onCount === chips.length;
      toggleEl.textContent = allOn ? 'none' : 'all';
      if (statusEl) statusEl.textContent = allOn ? 'All' : `${onCount} of ${chips.length}`;
      // Auto-open the section when something is deselected so the state is visible
      if (sectionEl && !allOn) sectionEl.open = true;
    }
    chipsEl.addEventListener('click', updateLabel);
    toggleEl.addEventListener('click', () => {
      const allOn = [...chipsEl.querySelectorAll('.chip')].every((c) => c.classList.contains('on'));
      chipsEl.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', !allOn));
      updateLabel();
    });
  }
  setupChipGroupToggle(
    document.getElementById('formatChipsToggle'),
    document.getElementById('formatChips'),
    document.getElementById('formatSection'),
    document.getElementById('formatSectionStatus')
  );
  setupChipGroupToggle(
    document.getElementById('chainChipsToggle'),
    document.getElementById('chainChips'),
    document.getElementById('chainSection'),
    document.getElementById('chainSectionStatus')
  );

  async function loadMovies({ silent = false } = {}) {
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();
    searchedRadiusMin = Number(radius) || null;

    if ((!lat || !lng) && !place) {
      if (!silent) els.statusLine.textContent = 'Fill in a zip code or city first -- movie lookup needs to know where to look.';
      return;
    }
    if (!radius) {
      if (!silent) els.statusLine.textContent = 'Fill in a radius first.';
      return;
    }

    els.loadMoviesBtn.disabled = true;
    els.loadMoviesBtn.textContent = 'Loading...';
    els.statusLine.textContent = "Checking what's actually playing nearby...";

    try {
      const params = new URLSearchParams({ radiusMin: radius, date: els.searchDate.value });
      if (lat && lng) {
        params.set('lat', lat);
        params.set('lng', lng);
      } else {
        params.set('place', place);
      }
      const res = await fetch(`/api/movies?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        els.statusLine.textContent = `Movie lookup failed: ${data.error || 'unknown error'}`;
        return;
      }

      if (data.movies.length) {
        // Merge with whatever's already loaded (the pre-loaded popular
        // list, most likely) rather than replacing it -- this button is
        // now specifically for "add what's missing," so wiping out
        // options that were already there would be a regression.
        const currentSelection = els.movie.value;
        const existingTitles = new Set(
          [...els.movie.options].map((o) => o.value).filter(Boolean)
        );
        const newTitles = data.movies.filter((m) => !existingTitles.has(movieTitleOf(m)));
        if (newTitles.length) {
          els.movie.insertAdjacentHTML(
            'beforeend',
            newTitles.map(movieOptionHtml).join('')
          );
          // Keep the whole list alphabetical after appending -- without
          // this, newly-discovered titles would land at the end in
          // whatever order the server returned them, breaking the sort
          // order the initial "/api/popular-movies" load already
          // established.
          const sortedOptions = [...els.movie.options].sort((a, b) =>
            a.value.localeCompare(b.value, undefined, { sensitivity: 'base' })
          );
          sortedOptions.forEach((opt) => els.movie.appendChild(opt)); // re-appending an existing <option> moves it, doesn't duplicate it
        }
        // Re-apply a saved selection from a previous session if it's
        // now among the loaded movies; otherwise keep whatever was
        // already selected.
        if (pendingMovieSelection && [...els.movie.options].some((o) => o.value === pendingMovieSelection)) {
          els.movie.value = pendingMovieSelection;
        } else if (currentSelection) {
          els.movie.value = currentSelection;
        }
        pendingMovieSelection = null;
      } else if (![...els.movie.options].some((o) => o.value)) {
        // Only show "nothing found" if the dropdown is otherwise
        // genuinely empty -- if the pre-loaded popular list already has
        // options, this button coming back empty just means "nothing
        // *extra* found," not "nothing at all."
        els.movie.innerHTML = '<option value="" disabled selected>No movies found nearby</option>';
      }
      els.statusLine.textContent = data.movies.length
        ? `Found ${data.movies.length} movie(s) playing across ${data.theatersChecked} nearby theater(s) -- pick one from the Movie dropdown.`
        : data.theatersChecked > 0
          ? `Found ${data.theatersChecked} theater(s) nearby but couldn't retrieve their schedules (SerpApi quota may be exhausted).`
          : `No theaters found in range -- try widening the radius.`;
    } catch (err) {
      els.statusLine.textContent = `Couldn't reach the server for movie lookup: ${err.message}`;
    } finally {
      els.loadMoviesBtn.disabled = false;
      els.loadMoviesBtn.textContent = 'Not seeing it?';
      if (!silent) els.movieFreeText.style.display = '';
    }
  }

  els.loadMoviesBtn.addEventListener('click', () => loadMovies());

  // "Use my location" button: after GPS coords land, reload the movie list.
  els.locateBtn.addEventListener('click', () => {
    const poll = setInterval(() => {
      if (els.lat.value && els.lng.value) {
        clearInterval(poll);
        loadMovies({ silent: true });
      }
    }, 200);
    setTimeout(() => clearInterval(poll), 10000);
  });

  // Auto-load on blur/Enter after typing a zip or city.
  function onPlaceCommit() {
    if (els.lat.value && els.lng.value) return; // already have coords from GPS
    loadMovies({ silent: true });
  }
  els.place.addEventListener('blur', onPlaceCommit);
  els.place.addEventListener('keydown', (e) => { if (e.key === 'Enter') onPlaceCommit(); });

  // The badge reports what the SERVER says is deployed, not a number baked into
  // this file. Left blank until the answer arrives -- an empty badge is honest,
  // a stale hardcoded one is not.
  (async () => {
    try {
      const res = await fetch('/api/version');
      if (!res.ok) return;
      const { version, commit } = await res.json();
      const el = document.getElementById('versionBadge');
      if (!el || !version) return;
      el.textContent = version;
      if (commit) el.title = `deployed version ${version} (${commit})`;
    } catch {
      // Offline or the endpoint is missing -- leave it blank rather than lying.
    }
  })();

  function fmtTime24to12(hhmmss) {
    if (!hhmmss) return '';
    const [h, m] = hhmmss.split(':').map(Number);
    const hour12 = ((h + 11) % 12) + 1;
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${hour12}:${String(m).padStart(2, '0')} ${ampm}`;
  }

  function fmtRuntime(minutes) {
    if (!minutes) return '';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  async function runSearch() {
    const movie = (els.movieFreeText.style.display !== 'none' && els.movieFreeText.value.trim())
      ? els.movieFreeText.value.trim()
      : els.movie.value.trim();
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();
    searchedRadiusMin = Number(radius) || null;
    const deadline = els.deadline.value.trim();

    if (regalEs) { regalEs.close(); regalEs = null; }
    if (searchEs) { searchEs.close(); searchEs = null; }
    regalStillChecking = false;
    searchStillChecking = false;
    const _timingBar = document.getElementById('timingBar');
    if (_timingBar) _timingBar.style.display = 'none';
    els.banners.innerHTML = '';
    if (els.pageFooter) els.pageFooter.innerHTML = '';
    els.results.innerHTML = '';
    earlyShowingsExpanded = false; // a new search starts collapsed
    activeResultFormats = new Set(); seenResultFormats = new Set(); // fresh search -- reset to "all formats on"
    activeResultChains = new Set(); seenResultChains = new Set(); // fresh search -- reset to "all chains on"
    activeResultMovies = new Set(); seenResultMovies = new Set(); // fresh search -- reset to "all movies on"

    if (!movie || ((!lat || !lng) && !place) || !radius || !deadline) {
      els.banners.innerHTML = '<div class="banner error">Fill in movie, location, radius, and deadline before searching.</div>';
      return;
    }

    saveCurrent();

    // Paint the film header NOW, before geocoding and before either request is
    // sent. The title is whatever was searched for and the dropdown already
    // carries the runtime, so there is nothing to wait for; the year, poster
    // and scores fill in when the `ratings` event lands a few seconds later.
    // Placed ahead of the geocode await deliberately -- seeding it after that
    // left the page blank for however long geocoding took.
    const _selectedOption = els.movie.selectedOptions && els.movie.selectedOptions[0];
    const localRuntimeMin = _selectedOption && _selectedOption.value === movie && _selectedOption.dataset.runtime
      ? Number(_selectedOption.dataset.runtime)
      : null;
    els.statusLine.innerHTML = filmHeroHtml(
      { movie, ...(localRuntimeMin ? { runtimeMinutes: localRuntimeMin } : {}) },
      { countLine: 'Searching theaters&hellip;' }
    );

    const activeFormats = [...document.querySelectorAll('#formatChips .chip.on')].map((c) => c.dataset.format);
    const activeChains = [...document.querySelectorAll('#chainChips .chip.on')].map((c) => c.dataset.chain);

    const clientTime = Date.now();
    const params = new URLSearchParams({
      movie, radiusMin: radius, deadline,
      date: els.searchDate.value,
      clientTime,
      formats: activeFormats.join(','),
      chains: activeChains.join(','),
    });
    if (lat && lng) {
      params.set('lat', lat);
      params.set('lng', lng);
    } else {
      params.set('place', place);
    }

    // Request notification permission while still in the synchronous click
    // handler -- browsers require a direct user gesture for this prompt and
    // may silently ignore it if called after an await.
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }

    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching...';
    // No status-line text here any more: the film header painted above already
    // says "Searching theaters..." in its count line, and assigning to
    // statusLine at this point wiped that header off the page microseconds
    // after it was drawn.

    // Timing bar
    const timingBar = document.getElementById('timingBar');
    const t0 = Date.now();
    let timingFirstResults = null, timingFirstRegal = null, timingDone = null;
    let timingTick = null;
    const renderTiming = (done) => {
      const elapsed = (ms) => (ms / 1000).toFixed(1) + 's';
      const now = Date.now();
      const parts = [`elapsed: ${elapsed(now - t0)}`];
      if (timingFirstResults !== null) parts.push(`first results: ${elapsed(timingFirstResults - t0)}`);
      if (timingFirstRegal !== null) parts.push(`first Regal: ${elapsed(timingFirstRegal - t0)}`);
      if (timingDone !== null) parts.push(`done: ${elapsed(timingDone - t0)}`);
      timingBar.style.display = '';
      timingBar.textContent = parts.join('  ·  ');
      if (done && timingTick) { clearInterval(timingTick); timingTick = null; }
    };
    timingTick = setInterval(() => renderTiming(false), 250);
    renderTiming(false);

    // When the user typed a place/zip instead of coordinates, geocode it
    // ONCE here before firing both /api/search and /api/search-regal.
    // Without this, both backend calls geocode the same place in parallel,
    // racing to Nominatim and triggering 429s on Render's shared IP range.
    // If the user typed a place/zip (no coordinates yet), pre-geocode it
    // once here so both /api/search and /api/search-regal get lat/lng +
    // locationLabel without each independently hitting Nominatim.
    // If the user used "Use my location" (GPS), they already have lat/lng
    // but no locationLabel -- pass place through so the backend geocodes
    // for the label; the inFlight dedup in geocode.js ensures only one
    // Nominatim/Photon call fires even if both endpoints hit it at once.
    let resolvedLat = lat, resolvedLng = lng, resolvedLocation = null;
    if ((!lat || !lng) && place) {
      try {
        const geo = await fetch(`/api/geocode?place=${encodeURIComponent(place)}`).then((r) => r.json());
        if (geo.error) throw new Error(geo.error);
        resolvedLat = String(geo.lat);
        resolvedLng = String(geo.lng);
        resolvedLocation = geo.locationLabel;
      } catch (err) {
        els.banners.innerHTML = `<div class="banner error">Couldn't find location "${place}": ${err.message}</div>`;
        els.searchBtn.disabled = false;
        els.searchBtn.textContent = 'Find showtimes';
        return;
      }
      // Swap place for resolved coords + label in params.
      params.delete('place');
      params.set('lat', resolvedLat);
      params.set('lng', resolvedLng);
      params.set('location', resolvedLocation);
    }

    // Regal split out into its own request (see /api/search-regal) --
    // its retry-with-delays logic can make it noticeably slower than
    // every other chain, so it shouldn't hold up showing everything
    // else. Only fire it if Regal's chain chip is actually on.
    const wantsRegal = activeChains.includes('regal');
    const regalParams = new URLSearchParams({
      movie, radiusMin: radius, deadline,
      date: els.searchDate.value,
      clientTime,
      formats: activeFormats.join(','),
    });
    if (resolvedLat && resolvedLng) {
      regalParams.set('lat', resolvedLat);
      regalParams.set('lng', resolvedLng);
      if (resolvedLocation) regalParams.set('location', resolvedLocation);
    } else {
      regalParams.set('place', place);
    }

    // Both endpoints now stream. They feed two separate arrays and share one
    // merge/sort/render path, so a card appears the moment its chain prices it
    // regardless of which stream it came from.
    //
    // Kept as two arrays rather than one because each stream needs to be able
    // to replace its own contribution without disturbing the other's -- the
    // previous version reconstructed the non-Regal half by filtering
    // lastRenderData on every Regal event, which only worked while the
    // non-Regal half arrived in a single shot and stopped changing.
    const searchResults = [];
    const regalResults = [];
    // Seeded from the form (see the header paint above) so re-renders during
    // the search keep the title and runtime instead of dropping back to
    // placeholders. The server's own meta overwrites these when it arrives.
    let searchMeta = {
      movie,
      searchDate: els.searchDate.value,
      ...(localRuntimeMin ? { runtimeMinutes: localRuntimeMin, runtimeIsEstimate: false } : {}),
    };
    let regalChainReports = [];

    function renderMerged() {
      // Don't paint an empty state while the search is still running. With
      // nothing found YET, renderResults draws its "No showings of X found
      // within your window" message -- which is a statement about a finished
      // search, and showing it mid-flight told people the search had failed
      // seconds before results appeared and replaced it. While either stream
      // is live and nothing has arrived, leave the "Searching..." status up
      // and draw nothing; the first result, or the last stream finishing,
      // renders normally.
      //
      // This also covers the pre-`meta` case, where an empty searchMeta
      // rendered as "No showings of undefined ... on ?".
      const nothingYet = searchResults.length === 0 && regalResults.length === 0;
      if (nothingYet && (searchStillChecking || regalStillChecking)) {
        // Nothing to list yet, but the film header doesn't depend on results --
        // paint it now and let the poster and scores fill in as they arrive,
        // rather than leaving the page blank for the whole search.
        if (!(lastRenderOpts || {}).showMovieName) {
          els.statusLine.innerHTML = filmHeroHtml(
            { ...searchMeta, movie: searchMeta.movie || movie },
            { countLine: 'Searching theaters&hellip;' }
          );
        }
        return;
      }
      if (nothingYet && !searchMeta.movie) return;
      const merged = [...searchResults, ...regalResults];
      merged.sort((a, b) => {
        const pa = effectivePriceForSorting(a), pb = effectivePriceForSorting(b);
        if (pa == null && pb == null) return 0;
        if (pa == null) return 1;
        if (pb == null) return -1;
        return pa - pb;
      });
      // The cap applies to the sorted list, which is why the server sends the
      // number instead of slicing: it streamed these before they were sorted.
      const cap = searchMeta.resultsCap ?? 25;
      let shown = merged.slice(0, cap);
      // A chain that priced NOTHING sorts entirely below the cap and disappears
      // from the page, even though its showings are real and were fetched.
      // That is what happened to Landmark: 6 sessions, all unpriced, ranked
      // 80th-85th of 85, cut by a cap of 25 -- indistinguishable from the chain
      // having found nothing at all. Guarantee each chain its best row.
      // `merged` is already sorted, so the first row past the cap for a missing
      // chain IS that chain's best.
      const shownChains = new Set(shown.map((r) => r.chain));
      const rescued = [];
      for (const r of merged.slice(cap)) {
        if (shownChains.has(r.chain)) continue;
        shownChains.add(r.chain);
        rescued.push(r);
      }
      renderResults({
        ...searchMeta,
        results: rescued.length ? shown.concat(rescued) : shown,
        matchingShowings: searchMeta.matchingShowings ?? merged.length,
        chainReports: [...(searchMeta.chainReports || []), ...regalChainReports],
        // `|| {}` matters on the first render: lastRenderOpts starts as null,
        // and renderResults' `opts = {}` default only fills in for undefined.
        // The old code sidestepped this by calling renderResults(data) with no
        // second argument for the first paint; renderMerged always passes one.
      }, lastRenderOpts || {});
    }

    const searchDonePromise = new Promise((resolve) => {
      searchEs = new EventSource(`/api/search?${params.toString()}`);

      searchEs.addEventListener('meta', (e) => {
        try {
          searchMeta = { ...searchMeta, ...JSON.parse(e.data) };
          renderMerged(); // paint the header/empty state instead of a blank page
        } catch (err) { console.error('search SSE meta parse error:', err); }
      });

      // Ratings resolve early (one OMDb call fired alongside discovery) but used
      // to ride along on `done`, so the poster waited for the slowest chain.
      searchEs.addEventListener('ratings', (e) => {
        try {
          searchMeta = { ...searchMeta, ...JSON.parse(e.data) };
          renderMerged();
        } catch (err) { console.error('search SSE ratings parse error:', err); }
      });

      searchEs.addEventListener('result', (e) => {
        try {
          if (timingFirstResults === null) { timingFirstResults = Date.now(); renderTiming(false); }
          searchResults.push(JSON.parse(e.data));
          renderMerged();
        } catch (err) { console.error('search SSE result parse error:', err); }
      });

      searchEs.addEventListener('done', (e) => {
        try { searchMeta = { ...searchMeta, ...JSON.parse(e.data) }; } catch (err) {}
        if (timingFirstResults === null) { timingFirstResults = Date.now(); }
        // Both flags feed one shared note, but each stream still clears its own
        // as it finishes so the note disappears the moment the LAST one is
        // done -- not whenever the join below happens to run.
        searchStillChecking = false;
        renderMerged();
        searchEs.close();
        searchEs = null;
        resolve();
      });

      searchEs.onerror = () => {
        // Also fires when the server answered 400 before opening the stream
        // (bad input, geocode failure) -- there's no body to read from an
        // EventSource, so say what's actionable rather than guessing.
        if (searchEs) { searchEs.close(); searchEs = null; }
        if (searchResults.length === 0 && !searchMeta.movie) {
          els.banners.innerHTML = '<div class="banner error">Search failed to start. Check the movie, location, radius and deadline, then try again.</div>';
        }
        resolve();
      };
    });

    // Regal streams results via SSE (EventSource) so cards appear as each
    // performance finishes pricing -- no waiting for all to complete first.
    const regalDonePromise = wantsRegal ? new Promise((resolve) => {
      regalEs = new EventSource(`/api/search-regal?${regalParams.toString()}`);

      regalEs.addEventListener('result', (e) => {
        try {
          const result = JSON.parse(e.data);
          if (timingFirstRegal === null) { timingFirstRegal = Date.now(); renderTiming(false); }
          regalResults.push(result);
          renderMerged();
        } catch (err) {
          console.error('Regal SSE result parse error:', err);
        }
      });

      regalEs.addEventListener('done', (e) => {
        // Regal reports itself from its own endpoint; merge it alongside the
        // eight chains /api/search reports so the UI shows one combined list.
        try {
          const d = JSON.parse(e.data);
          if (d.chainReports) regalChainReports = d.chainReports;
        } catch (err) {}
        // timingDone is set once in the finally below, after BOTH streams are
        // finished -- setting it here would stop the clock while /api/search
        // was still delivering results.
        regalStillChecking = false;
        renderMerged();
        regalEs.close();
        regalEs = null;
        resolve(regalResults);
      });

      regalEs.onerror = (err) => {
        console.error('Regal SSE connection error:', err);
        if (regalEs) { regalEs.close(); regalEs = null; }
        resolve(regalResults); // surface whatever arrived before the error
      };
    }) : Promise.resolve(null);

    // The "still checking Regal" note shows as soon as the search starts now,
    // rather than after /api/search came back -- with both halves streaming
    // there is no longer a point where one is known to be finished and the
    // other isn't.
    searchStillChecking = true;
    if (wantsRegal) regalStillChecking = true;

    try {
      await Promise.all([searchDonePromise, regalDonePromise]);
      searchStillChecking = false;
      regalStillChecking = false;
      renderMerged(); // final pass: drops the "still checking" note
      // Deliberately NOT clearing statusLine here: renderResults owns it and
      // writes the result summary ("Cheapest is $X at Y") into it, so the
      // "Checking nearby theaters..." message is replaced rather than needing
      // to be cleared. Blanking it here wiped the summary instead.
      notifySearchComplete(lastRenderData?.results?.length ?? 0);
      flashSearchComplete();
    } catch (err) {
      els.banners.innerHTML = `<div class="banner error">Couldn't reach the server. Is ./start.sh still running? (${err.message})</div>`;
      els.statusLine.textContent = '';
    } finally {
      els.searchBtn.disabled = false;
      els.searchBtn.textContent = searchMode === 'window' ? 'Find what fits' : 'Find showtimes';
      timingDone = Date.now();
      renderTiming(true);
    }
  }

  async function runWindowSearch() {
    const lat = els.lat.value.trim();
    const lng = els.lng.value.trim();
    const place = els.place.value.trim();
    const radius = els.radius.value.trim();
    searchedRadiusMin = Number(radius) || null;
    const availableFrom = els.availableFrom.value.trim();
    const hours = parseFloat(els.availableForHours.value);

    els.banners.innerHTML = '';
    if (els.pageFooter) els.pageFooter.innerHTML = '';
    els.results.innerHTML = '';
    earlyShowingsExpanded = false; // a new search starts collapsed
    activeResultFormats = new Set(); seenResultFormats = new Set(); // fresh search -- reset to "all formats on"
    activeResultChains = new Set(); seenResultChains = new Set(); // fresh search -- reset to "all chains on"
    activeResultMovies = new Set(); seenResultMovies = new Set(); // fresh search -- reset to "all movies on"

    if (((!lat || !lng) && !place) || !radius || !availableFrom || !hours) {
      els.banners.innerHTML = '<div class="banner error">Fill in location, radius, "free from" time, and how many hours before searching.</div>';
      return;
    }

    saveCurrent();

    // Compute an explicit end clock time from "free from" + duration --
    // the backend takes two clock times, not a duration, and this keeps
    // that contract simple. Doesn't handle crossing midnight (see the
    // matching note in server.js).
    const [fromH, fromM] = availableFrom.split(':').map(Number);
    const totalMinutes = fromH * 60 + fromM + Math.round(hours * 60);
    const untilH = Math.floor(totalMinutes / 60) % 24;
    const untilM = totalMinutes % 60;
    const availableUntil = `${String(untilH).padStart(2, '0')}:${String(untilM).padStart(2, '0')}`;

    if (totalMinutes >= 24 * 60) {
      els.banners.innerHTML = '<div class="banner error">That window runs past midnight, which isn\'t supported yet -- try a shorter duration or a later start time.</div>';
      return;
    }

    const activeFormats = [...document.querySelectorAll('#formatChips .chip.on')].map((c) => c.dataset.format);
    const activeChains = [...document.querySelectorAll('#chainChips .chip.on')].map((c) => c.dataset.chain);

    const params = new URLSearchParams({
      radiusMin: radius,
      availableFrom,
      availableUntil,
      date: els.searchDate.value,
      formats: activeFormats.join(','),
      chains: activeChains.join(','),
    });
    if (lat && lng) {
      params.set('lat', lat);
      params.set('lng', lng);
    } else {
      params.set('place', place);
    }

    els.searchBtn.disabled = true;
    els.searchBtn.textContent = 'Searching...';
    els.statusLine.textContent = 'Checking what fits nearby...';

    try {
      const res = await fetch(`/api/window-search?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        els.banners.innerHTML = `<div class="banner error">${data.error || 'Search failed'}${data.detail ? ' -- ' + data.detail : ''}</div>`;
        els.statusLine.textContent = '';
        return;
      }

      renderResults(data, { showMovieName: true });
    } catch (err) {
      els.banners.innerHTML = `<div class="banner error">Couldn't reach the server. Is ./start.sh still running? (${err.message})</div>`;
      els.statusLine.textContent = '';
    } finally {
      els.searchBtn.disabled = false;
      els.searchBtn.textContent = 'Find what fits';
      notifySearchComplete(lastRenderData?.results?.length ?? 0);
      flashSearchComplete();
    }
  }

  // Marks the moment every chain has reported. Placed on the count line, which
  // is where the eye already is after a search, and removed after a few seconds
  // so it doesn't become permanent furniture.
  function flashSearchComplete() {
    const host = document.querySelector('.film-hero-count') || els.statusLine;
    if (!host) return;
    host.querySelectorAll('.search-done').forEach((n) => n.remove());
    const chip = document.createElement('span');
    chip.className = 'search-done';
    chip.textContent = 'Search complete';
    host.appendChild(chip);
    setTimeout(() => chip.remove(), 4600);
    if (els.results) {
      els.results.classList.remove('results-settled');
      void els.results.offsetWidth;          // restart the animation on a re-run
      els.results.classList.add('results-settled');
      setTimeout(() => els.results.classList.remove('results-settled'), 1300);
    }
  }

  function notifySearchComplete(resultCount) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible') return; // already on the tab, no need
    const body = resultCount > 0
      ? `${resultCount} showing${resultCount === 1 ? '' : 's'} found`
      : 'No showings found for your search';
    new Notification('Showtime Finder', { body, icon: '/favicon.ico' });
  }

  // Format filter state -- persists across re-renders triggered by
  // clicking a chip (so toggling doesn't lose your other selections),
  // but gets reset to "all on" whenever a genuinely new search runs
  // (see the reset calls in runSearch/runWindowSearch).
  let activeResultFormats = new Set(); // starts empty; renderResults() populates it as new formats are seen

  // Post-search chain filter -- same pattern as activeResultFormats
  // above (any subset can be on, resets to "all on" for a genuinely new
  // search), but a separate Set since a person may want, say, only
  // Standard format AND only AMC/Regal at the same time -- these are
  // two independent filters over the same result set, not one combined
  // control.
  let activeResultChains = new Set(); // starts empty; renderResults() populates it as new chains are seen

  // Tracks every format/chain value ever seen THIS search (not just
  // what's currently active) -- see the long comment in renderResults
  // for why this exists: without it, a value that arrives on a LATER
  // merge (Regal's results specifically, which fetch separately and
  // finish after the main search) would never get added to the active
  // Set and would silently read as "toggled off" despite the user never
  // touching it.
  let seenResultFormats = new Set();
  let seenResultChains = new Set();
  // Window-search mixes many films, so "just show me showtimes for THIS one"
  // is the filter that mode actually needs. Movie mode has a single film by
  // definition, so these chips only render when showMovieName is set.
  let activeResultMovies = new Set();
  let seenResultMovies = new Set();

  const CHAIN_DISPLAY_NAMES = {
    amc: "AMC",
    regal: "Regal",
    cinemark: "Cinemark",
    cinemawest: "Cinema West",
    harkins: "Harkins",
    regency: "Regency",
    alamo: "Alamo Drafthouse",
    marcus: "Marcus",
    landmark: "Landmark",
    other: "Other",
  };

  // Sort mode for the already-rendered result set -- purely client-side,
  // same instant-no-refetch pattern as the format filter above, since
  // every result already carries distanceMin from the server and price
  // sorting was already happening server-side. "Cheapest" price and
  // "closest" distance are independent orderings of the same data, not
  // something that needs a new search.
  let resultSortMode = 'price'; // 'price' | 'distance'

  // Whether the "earlier showings" block is expanded. Kept here rather than
  // read back off the DOM because renderResults rebuilds els.results wholesale
  // on every chip click -- so an expanded block silently collapsed each time a
  // chain or format filter changed, and had to be re-opened.
  let earlyShowingsExpanded = false;

  // The radius the CURRENT results were fetched with -- snapshotted at search
  // time, not read from the input at render time, so editing the box without
  // re-searching doesn't silently re-label cards that never moved.
  let searchedRadiusMin = null;
  let showBasePriceOnly = false; // when true, sort/display uses pre-fee ticket price
  let sortByDiscountPrice = true; // when true, AMC Stubs / Regency Tuesday prices are used for sort order

  // Says plainly what the number is and how it was derived. An estimate that
  // doesn't explain itself is indistinguishable from a real price the app got
  // wrong, which is worse than showing nothing.
  const ESTIMATE_BASIS_TEXT = {
    'theater+format+time+day': 'this theater, same format, same time of day, same kind of day',
    'theater+format+time': 'this theater, same format and time of day',
    'theater+format': 'this theater, same format',
    'theater+time': 'this theater, same time of day',
    'theater': 'this theater',
