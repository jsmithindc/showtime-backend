<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Full bleed and square: iOS masks the corners itself and fills any
       transparency with black. Same motif as favicon.svg, scaled. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#241f2d"/>
      <stop offset="1" stop-color="#14121a"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" fill="url(#glow)"/>
  <g fill="#e2a545">
    <rect x="18" y="26" width="22" height="16" rx="4"/>
    <rect x="18" y="60" width="22" height="16" rx="4"/>
    <rect x="18" y="94" width="22" height="16" rx="4"/>
    <rect x="18" y="128" width="22" height="16" rx="4"/>
    <rect x="140" y="26" width="22" height="16" rx="4"/>
    <rect x="140" y="60" width="22" height="16" rx="4"/>
    <rect x="140" y="94" width="22" height="16" rx="4"/>
    <rect x="140" y="128" width="22" height="16" rx="4"/>
  </g>
  <rect x="50" y="20" width="80" height="140" rx="6" fill="#1d1a24" stroke="#3a3346" stroke-width="2"/>
  <polygon points="74,62 74,118 123,90" fill="#e2a545"/>
</svg>
